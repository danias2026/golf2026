<script>
function rays(id,n,r,spread,cols){const g=document.getElementById(id);let s='';for(let i=0;i<n;i++){const a0=-90-spread/2+i*spread/n,a1=a0+spread/n;const p=a=>[Math.cos(a*Math.PI/180)*r,Math.sin(a*Math.PI/180)*r];const[a,b]=p(a0),[c,d]=p(a1);s+=`<path d="M0 0 L${a} ${b} A${r} ${r} 0 0 1 ${c} ${d} Z" fill="${cols[i%cols.length]}"/>`;}g.innerHTML=s;}
rays('rBand',16,560,180,['#F3E7CF','#002838']);
rays('rArch',22,560,180,['#EAD7AE','#F3E7CF']);
rays('rFanL',7,24,180,['#C9963E','#F3E7CF']);rays('rFanR',7,24,180,['#C9963E','#F3E7CF']);
let sc='';for(let x=780;x<1240;x+=24){sc+=`<path d="M${x} 130 a12 12 0 0 1 24 0 z"/>`;}document.getElementById('scBand').innerHTML=sc;
let w='';const R=24;[[892,'#009098'],[906,'#006868']].forEach(([y,c],ri)=>{const off=(ri%2)*R;for(let x=-R+off;x<1220+R;x+=2*R){w+=`<path d="M${x-R} ${y} a${R} ${R} 0 0 1 ${2*R} 0 z" fill="${c}" stroke="#C9963E" stroke-width="1.3"/>`;}});
document.getElementById('waves').innerHTML=w;
document.fonts.ready.then(()=>{window.__ready=true});
</script></body></html>
