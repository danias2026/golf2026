<!-- GMJF -->
<image href="gmjf-logo-black.png" x="450" y="1166" height="38" width="80"/>
</svg>
<script>
function rays(id,n,r,spread,cols){const g=document.getElementById(id);let s='';for(let i=0;i<n;i++){const a0=-90-spread/2+i*spread/n,a1=a0+spread/n;const p=a=>[Math.cos(a*Math.PI/180)*r,Math.sin(a*Math.PI/180)*r];const[a,b]=p(a0),[c,d]=p(a1);s+=`<path d="M0 0 L${a} ${b} A${r} ${r} 0 0 1 ${c} ${d} Z" fill="${cols[i%cols.length]}"/>`;}g.innerHTML=s;}
rays('rBand',14,500,180,['#F3E7CF','#002838']);
rays('rArch',22,700,180,['#EAD7AE','#F3E7CF']);
rays('rFan',7,26,180,['#C9963E','#F3E7CF']);
let sc='';for(let x=640;x<1000;x+=26){sc+=`<path d="M${x} 150 a13 13 0 0 1 26 0 z"/>`;}document.getElementById('scBand').innerHTML=sc;
let w='';const R=26;[[1140,'#009098'],[1155,'#006868']].forEach(([y,c],ri)=>{const off=(ri%2)*R;for(let x=-R+off;x<980+R;x+=2*R){w+=`<path d="M${x-R} ${y} a${R} ${R} 0 0 1 ${2*R} 0 z" fill="${c}" stroke="#C9963E" stroke-width="1.4"/>`;}});
document.getElementById('waves').innerHTML=w;
document.fonts.ready.then(()=>{window.__ready=true});
</script></body></html>
