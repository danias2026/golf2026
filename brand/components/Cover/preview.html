<!-- @dsCard height=340 -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Cover</title>
<style>
html,body{margin:0;height:100%}
body{background:var(--surface);width:960px;height:340px;position:relative;overflow:hidden}
svg{position:absolute;left:0;top:0;display:block}
.ink{fill:var(--ink)} .inv{fill:var(--surface)} .teal{fill:var(--lagoon-teal)} .red{fill:var(--classic-red)}
.gold{fill:var(--deco-gold)} .pink{fill:var(--sunset-pink)} .wave{fill:var(--ocean-teal)}
.rule{stroke:var(--rule);stroke-width:1;fill:none}
.txt{position:absolute;left:48px;top:150px;max-width:880px}
h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:64px;line-height:.95;color:var(--ink)}
p{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.4;color:var(--ink-muted)}
</style></head>
<body>
<svg width="960" height="120" viewBox="0 0 960 120" aria-hidden="true">
  <!--
    blocks: ink 400x112 (navy slab Day), lagoon-teal 160, classic-red 80, deco-gold 200, sunset-pink 120; all radius-0
    arrangement: a strip of unequal bands across the top, like the stepped Art Deco frame of the key art
    pattern: literal motif, the deco sunburst fan (9 rays cut from the slab in surface) plus half-round waves (radius 24 = space-4) in ocean-teal along the gold and pink blocks, echoing the wave band
    steps/radii: band 112, gap below 40 (space-5), wave radius 24 (space-4), gold double rule 4 apart (space-1); radius-0 corners
  -->
  <rect class="ink" x="0" y="0" width="400" height="112"/>
  <g class="inv">
    <polygon points="200,112 0,0 36,0"/>
    <polygon points="200,112 76,0 112,0"/>
    <polygon points="200,112 152,0 182,0"/>
    <polygon points="200,112 218,0 248,0"/>
    <polygon points="200,112 288,0 324,0"/>
    <polygon points="200,112 364,0 400,0"/>
  </g>
  <rect class="teal" x="400" y="0" width="160" height="112"/>
  <rect class="red" x="560" y="0" width="80" height="112"/>
  <rect class="gold" x="640" y="0" width="200" height="112"/>
  <rect class="pink" x="840" y="0" width="120" height="112"/>
  <g class="wave">
    <path d="M640 112 a24 24 0 0 1 48 0z"/><path d="M688 112 a24 24 0 0 1 48 0z"/><path d="M736 112 a24 24 0 0 1 48 0z"/>
    <path d="M784 112 a24 24 0 0 1 48 0z"/><path d="M832 112 a24 24 0 0 1 48 0z"/><path d="M880 112 a24 24 0 0 1 48 0z"/>
    <path d="M928 112 a24 24 0 0 1 48 0z"/>
  </g>
  <line class="rule" x1="0" y1="115.5" x2="960" y2="115.5"/>
  <line class="rule" x1="0" y1="119.5" x2="960" y2="119.5"/>
</svg>
<div class="txt">
  <h1>Golf &amp; Games<br>Classic 2027</h1>
  <p>Two JCCs. One tournament. One friendly rivalry!</p>
</div>
</body></html>
