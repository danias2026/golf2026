<!-- @dsCard height=340 -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Cover</title>
<style>
html,body{margin:0;height:100%}
body{background:var(--surface);width:960px;height:340px;position:relative;overflow:hidden}
svg{position:absolute;left:0;top:0;display:block}
.line{fill:none;stroke:var(--rule);stroke-linecap:round}
.l1{stroke-width:2}.l2{stroke-width:1}.l3{stroke-width:3}.l4{stroke-width:1}
.dot{fill:var(--classic-red)}
.ball{fill:var(--surface-raised);stroke:var(--ink);stroke-width:3}
.txt{position:absolute;left:48px;bottom:44px;max-width:440px}
h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:60px;line-height:.95;color:var(--ink)}
p{margin:14px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.4;color:var(--ink-muted)}
</style></head>
<body>
<svg width="960" height="340" viewBox="0 0 960 340" aria-hidden="true">
  <!--
    blocks: none by request; the brand is the logo plus flowing gold lines. One ball disc (radius 40 = space-5) in surface-raised with an ink keyline, one classic-red accent dot (radius 8 = space-2)
    arrangement: four gold hairlines sweep from the lower left zone edge (x 480) up and off the top-right edge, crossing once, like the lines in the campaign pieces
    pattern: editorial hairline row, chosen because the user named the gold lines as the signature element; stroke widths 1-3px in the rule token
    steps/radii: line spacing 16 (space-3) and 24 (space-4); ball radius 40 (space-5); dot radius 8 (space-2); radius-0 elsewhere
  -->
  <path class="line l3" d="M480 330 C 620 300, 700 160, 960 120"/>
  <path class="line l2" d="M480 314 C 640 290, 720 150, 960 96"/>
  <path class="line l1" d="M496 340 C 680 320, 760 220, 960 200"/>
  <path class="line l4" d="M520 340 C 700 300, 800 40, 960 24"/>
  <circle class="ball" cx="800" cy="88" r="40"/>
  <circle class="dot" cx="704" cy="226" r="8"/>
</svg>
<div class="txt">
  <h1>Golf &amp; Games<br>Classic 2027</h1>
  <p>Two JCCs. One tournament. One friendly rivalry!</p>
</div>
</body></html>
