<!-- @dsCard height=340 -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Cover</title>
<style>
html,body{margin:0;height:100%}
body{background:var(--felt);width:960px;height:340px;position:relative;overflow:hidden}
svg{position:absolute;left:0;top:0;display:block}
.deep{fill:var(--felt-deep)} .light{fill:var(--felt-light)} .gold{fill:var(--title-gold)}
.frame{fill:none;stroke:var(--frame-gold);stroke-width:3}
.amp{fill:var(--amp-silver);font-family:var(--font-display)}
.rule{stroke:var(--amp-silver);stroke-width:2;opacity:.6}
.txt{position:absolute;left:48px;bottom:48px;max-width:440px}
h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:62px;line-height:.95;color:var(--title-gold)}
p{margin:14px 0 0;font-family:var(--font-sans);font-size:14px;line-height:1.4;color:var(--ink-light)}
</style></head>
<body>
<svg width="960" height="340" viewBox="0 0 960 340" aria-hidden="true">
  <!--
    blocks: felt-deep 480x340 field and a felt-light 280x280 inner field on the right; a title-gold disc (radius 8) as the only warm accent; radius-0
    arrangement: one tall felt slab on the right holding a framed panel, like last year's flyer
    pattern: one oversized Playfair ampersand in amp-silver, clipped by the panel, plus two thin rules; chosen because the silver ampersand is the most specific shape of this brand
    steps/radii: frame inset 36 (space-3), rules 16 apart (space-2); radius-0
  -->
  <rect class="deep" x="480" y="0" width="480" height="340"/>
  <rect class="light" x="580" y="30" width="280" height="280"/>
  <rect class="frame" x="516" y="36" width="408" height="268"/>
  <clipPath id="pc"><rect x="580" y="30" width="280" height="280"/></clipPath>
  <text class="amp" x="720" y="300" text-anchor="middle" font-size="330" clip-path="url(#pc)">&amp;</text>
  <line class="rule" x1="560" y1="80" x2="880" y2="80"/><line class="rule" x1="560" y1="96" x2="880" y2="96"/>
  <circle class="gold" cx="720" cy="88" r="8"/>
</svg>
<div class="txt">
  <h1>Golf &amp; Games<br>Classic 2027</h1>
  <p>Two JCCs. One tournament. One friendly rivalry!</p>
</div>
</body></html>
