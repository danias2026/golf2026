<!doctype html>
<html><head><meta charset="utf-8"><title>SocialPost</title>
<style>
body{margin:0;padding:16px;background:var(--surface-raised);display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.post{width:520px;max-width:100%;aspect-ratio:1/1;display:flex;flex-direction:column;overflow:hidden}
.post .top{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 24px 12px;gap:12px}
.post--cream{background:var(--shore-cream);color:var(--deco-navy)}
.post--navy{background:var(--deco-navy);color:var(--shore-cream)}
.post .eb{font:600 13px/1 var(--font-deco);letter-spacing:.28em;text-transform:uppercase}
.post--cream .eb{color:#8A5F18}.post--navy .eb{color:var(--deco-gold)}
.post h2{font-family:var(--font-display);font-weight:400;font-size:40px;line-height:1.08;margin:0}
.post--cream h2 span{color:var(--lagoon-teal)}.post--navy h2 span{color:#FF5C7C}
.post .sub{font:700 15px/1.3 var(--font-deco);letter-spacing:.08em;text-transform:uppercase;margin:0}
.post .rule{width:60%;height:5px;border-top:1px solid var(--deco-gold);border-bottom:1px solid var(--deco-gold)}
.post .gg-waves{height:36px;flex:none}
.post .gg-strip{flex:none}
</style></head>
<body class="gg">
<div class="post post--cream">
  <div class="gg-strip gg-strip--compact" role="group" aria-label="Hosts"><img class="gg-logo-marjcc" src="/_blob/0e1e5145a04cedd9024837725dde7a9e" alt="Michael-Ann Russell JCC"><img class="gg-logo-mbjcc" src="/_blob/2f851d0ae1f6bcd3555efe0f220c3c8a" alt="The Galbut Family Miami Beach JCC"></div>
  <div class="top">
    <span class="eb">March 12, 2027</span>
    <h2>Two JCCs.<br>One Tournament.<br><span>One Friendly Rivalry!</span></h2>
    <div class="rule"></div>
    <p class="sub">Golf &amp; Mahjong &middot; Miami Beach Golf Club</p>
  </div>
  <div class="gg-gmjf gg-gmjf--compact"><img src="/_blob/e6dae2edfe31f4aff94a3c8237b4aac2" alt="Greater Miami Jewish Federation"></div>
</div>
<div class="post post--navy">
  <div class="gg-strip gg-strip--compact gg-strip--on-dark" role="group" aria-label="Hosts"><img class="gg-logo-marjcc" src="/_blob/60d1040677ea4075ceab6bc3040e0390" alt="Michael-Ann Russell JCC"><img class="gg-logo-mbjcc" src="/_blob/c66283f1e8272145abd38553962fa5d2" alt="The Galbut Family Miami Beach JCC"></div>
  <div class="top">
    <span class="eb">Golf &amp; Games Classic</span>
    <h2>Golf: May the best team win!<br><span>Mahjong: Everyone plays together!</span></h2>
    <div class="rule"></div>
    <p class="sub">More details coming soon!</p>
  </div>
  <div class="gg-gmjf gg-gmjf--compact"><img src="/_blob/e6dae2edfe31f4aff94a3c8237b4aac2" alt="Greater Miami Jewish Federation"></div>
</div>
</body></html>
