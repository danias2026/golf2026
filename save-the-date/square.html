<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
.page{width:1080px;height:1350px}
.sky{height:190px;flex:none}
.sky .sun{width:240px;height:92px}
.sky h1{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:30px;font-size:88px}
.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 90px;gap:20px}
.logo{width:800px}
.date{font-size:58px}
.when{font-family:'Josefin Sans',sans-serif;font-weight:600;font-size:26px;letter-spacing:.32em;text-transform:uppercase;margin:0}
.dbl{width:100%;height:8px;border-width:2px}
.eyebrow{font-size:22px}
.tag{font-size:28px;line-height:1.3}
.more{font-size:22px;color:var(--muted);margin:0}
.waves{--w:72px;--r1:24px;--h1:34px;--r2:34px;--h2:52px;height:52px;flex:none}
.hosts{height:130px;gap:48px;flex:none}
.hosts .mar{height:88px}.hosts .mb{height:62px}
.foot{height:96px;background:var(--cream);flex:none}
.foot img{height:64px}
</style></head><body>
<div class="page">
  <div class="sky"><div class="sun"></div><h1 class="std">Save the Date</h1></div>
  <div class="body">
    <img class="logo" src="../logo/golf-games-classic-logo.png" alt="Golf &amp; Games Classic">
    <p class="date">Friday, March 12, 2027</p>
    <p class="when">Miami Beach Golf Club</p>
    <div class="dbl"></div>
    <p class="eyebrow">Golf &amp; Mahjong Tournament</p>
    <p class="caps tag">Two JCCs. One Tournament. One Friendly Rivalry!</p>
    <p class="more">More details coming soon!</p>
  </div>
  <div class="waves"></div>
  <div class="hosts"><img class="mar" src="../brand/assets/marjcc-logo.png" alt=""><span class="div"></span><img class="mb" src="../brand/assets/mbjcc-logo.png" alt=""></div>
  <div class="foot"><img src="../brand/assets/gmjf-logo-black.png" alt=""></div>
</div>
</body></html>
