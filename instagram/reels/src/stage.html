<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Bebas+Neue&family=Poppins:wght@600;700&display=swap">
<style>
:root{--gold:#DEC000;--frame:#D8C012;--silver:#B4BAB4;--white:#F4F3EE}
html,body{margin:0;background:#383F38;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#383F38;font-family:'Bebas Neue',Impact,sans-serif;color:var(--white)}
.L{position:absolute;will-change:transform,opacity}
.c{left:0;right:0;text-align:center}
.caps{letter-spacing:.34em;text-indent:.34em;white-space:nowrap}
.play{font-family:'Playfair Display',Georgia,serif;font-weight:400}
.title{font-family:'Playfair Display',Georgia,serif;font-weight:400;color:var(--gold);line-height:1;white-space:nowrap}
.amp{color:var(--silver);display:inline-block;position:relative}
.ch{display:inline-block}
.gleam{background:linear-gradient(105deg,rgba(255,255,255,0) 42%,rgba(255,252,220,.95) 50%,rgba(255,255,255,0) 58%) no-repeat;background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{position:absolute;height:2px;background:rgba(244,243,238,.55);transform-origin:center}
.photo{position:absolute;left:0;width:100%;background:url(photo-temp.jpg) center/cover no-repeat;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 80%,transparent 100%),linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.spot{position:absolute;pointer-events:none;mix-blend-mode:soft-light}
.nowrap{white-space:nowrap}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
#dust{position:absolute;inset:0;pointer-events:none}
svg.frame{position:absolute;inset:0;pointer-events:none;overflow:visible}
</style></head><body>
<div id="stage"></div>
<script>
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;          // easeInOutCubic
const eox=t=>t>=1?1:1-Math.pow(2,-10*t);                     // easeOutExpo
const eoc=t=>1-Math.pow(1-t,3);                               // easeOutCubic
const win=(t,a,b)=>clamp((t-a)/(b-a));                         // 0..1 progress in [a,b]
const fadeIO=(t,a,b,c,d)=>Math.min(win(t,a,b), 1-win(t,c,d));  // in a..b, out c..d
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;}}

const MODE=(new URLSearchParams(location.search)).get('m')||'std';
const W=1080, H=MODE==='loop'?1350:1920;
const st=document.getElementById('stage'); st.style.width=W+'px'; st.style.height=H+'px';

function el(html){const d=document.createElement('div');d.innerHTML=html.trim();const e=d.firstChild;st.appendChild(e);return e;}

// ---------- background: felt ----------
const felt=el(`<svg class="L" style="left:0;top:0" width="${W}" height="${H}">
 <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .30  0 0 0 0 .34  0 0 0 0 .29  0 0 0 .55 0"/></filter>
 <radialGradient id="v" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#535A4D"/><stop offset=".55" stop-color="#4B5247"/><stop offset="1" stop-color="#383F38"/></radialGradient>
 <rect width="${W}" height="${H}" fill="url(#v)"/><rect width="${W}" height="${H}" filter="url(#n)" opacity=".45"/></svg>`);
const light=el(`<div class="L" style="left:0;top:0;width:${W}px;height:${H}px;background:radial-gradient(ellipse at 50% 40%,rgba(255,250,220,.10),rgba(255,250,220,0) 60%);mix-blend-mode:screen"></div>`);

// ---------- grain tile ----------
const gc=document.createElement('canvas');gc.width=gc.height=256;const gx=gc.getContext('2d');const gi=gx.createImageData(256,256);
const R0=rnd(11);for(let i=0;i<gi.data.length;i+=4){const v=R0()*255;gi.data[i]=gi.data[i+1]=gi.data[i+2]=v;gi.data[i+3]=255;}gx.putImageData(gi,0,0);

// ---------- frame ----------
const FI=MODE==='loop'?30:44;  // inset
const fw=W-2*FI, fh=H-2*FI;
const frame=el(`<svg class="frame" width="${W}" height="${H}">
 <rect id="fr" x="${FI}" y="${FI}" width="${fw}" height="${fh}" fill="none" stroke="#D8C012" stroke-width="3" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/>
 <rect id="gl" x="${FI}" y="${FI}" width="${fw}" height="${fh}" fill="none" stroke="#FFF6B0" stroke-width="4" pathLength="1000" stroke-dasharray="40 960" stroke-dashoffset="0" style="filter:drop-shadow(0 0 6px #FFE66A)" opacity="0"/>
</svg>`);
const fr=frame.querySelector('#fr'), gl=frame.querySelector('#gl');

// ---------- builders ----------
function logos(y,hM,hB,inset){
  const a=el(`<img class="L" src="marjcc-white.png" style="left:${inset}px;top:${y}px;height:${hM}px">`);
  const b=el(`<img class="L" src="mbjcc-white.png" style="right:${inset}px;top:${y+(hM-hB)/2}px;height:${hB}px">`);
  return [a,b];
}
function textLine(y,size,txt,cls='caps',color='var(--white)',extra=''){
  return el(`<div class="L c ${cls}" style="top:${y}px;font-size:${size}px;color:${color};${extra}">${txt}</div>`);
}
function titleBlock(y,size,gap){
  // two lines: GOLF&GAMES / CLASSIC, with per-letter spans + gleam twins
  const mk=(word)=>[...word].map(ch=>`<span class="ch">${ch}</span>`).join('');
  const line1=`${mk('GOLF')}<span class="ch amp" style="font-size:${size*1.21}px;margin:0 -${size*.05}px;top:${size*.08}px">&amp;</span>${mk('GAMES')}`;
  const l1=el(`<div class="L c title" style="top:${y}px;font-size:${size}px">${line1}</div>`);
  const l2=el(`<div class="L c title" style="top:${y+gap}px;font-size:${size}px">${mk('CLASSIC')}</div>`);
  const g1=el(`<div class="L c title gleam" style="top:${y}px;font-size:${size}px">GOLF<span class="amp" style="font-size:${size*1.21}px;margin:0 -${size*.05}px;top:${size*.08}px">&amp;</span>GAMES</div>`);
  const g2=el(`<div class="L c title gleam" style="top:${y+gap}px;font-size:${size}px">CLASSIC</div>`);
  return {l1,l2,g1,g2,chars:[...l1.querySelectorAll('.ch'),...l2.querySelectorAll('.ch')]};
}
function revealTitle(T,t,t0,stagger=.05,dur=.7){
  T.chars.forEach((c,i)=>{const p=eox(win(t,t0+i*stagger,t0+i*stagger+dur));
    c.style.opacity=p;c.style.transform=`translateY(${(1-p)*28}px) scale(${lerp(1.08,1,p)})`;c.style.filter=`blur(${(1-p)*6}px)`;});
  const sp=eio(win(t,t0,t0+T.chars.length*stagger+dur));
  [T.l1,T.l2].forEach(l=>l.style.letterSpacing=`${lerp(.12,0,sp)}em`);
}
function gleam(T,t,t0,dur=1.1){
  const p=win(t,t0,t0+dur); const on=p>0&&p<1;
  [T.g1,T.g2].forEach((g,i)=>{const q=clamp(p*1.15-i*.15);g.style.opacity=on?1:0;g.style.backgroundPosition=`${lerp(110,-10,eio(q))}% 0`;});
}
function setO(e,o,dy=0,s=1){e.style.opacity=o;e.style.transform=`translateY(${dy}px) scale(${s})`;}
function trackIn(e,t,a,b,from=.7,to=.34){const p=eoc(win(t,a,b));e.style.opacity=p;e.style.letterSpacing=`${lerp(from,to,p)}em`;e.style.textIndent=`${lerp(from,to,p)}em`;}
function rule(y,w){return el(`<div class="rule" style="top:${y}px;left:${(W-w)/2}px;width:${w}px;transform:scaleX(0)"></div>`);}
function photo(y,h){const p=el(`<div class="photo" style="top:${y}px;height:${h}px"></div>`);
  const s=el(`<div class="spot" style="left:0;top:${y}px;width:${W}px;height:${h}px;background:radial-gradient(circle at 50% 70%,rgba(255,255,240,.85) 0,rgba(255,255,240,.25) 9%,rgba(255,255,240,0) 20%)"></div>`);
  return {p,s};}

// ---------- dust ----------
const dust=document.createElement('canvas');dust.id='dust';dust.width=W;dust.height=H;st.appendChild(dust);const dx=dust.getContext('2d');
const R1=rnd(42);const P=[...Array(MODE==='loop'?18:26)].map(()=>({x:R1()*W,y:R1()*H,r:.8+R1()*2,sp:8+R1()*18,ph:R1()*6.28,a:.25+R1()*.5,ax:10+R1()*30}));
function drawDust(t,amt=1){dx.clearRect(0,0,W,H);dx.shadowColor='rgba(255,220,90,.9)';dx.shadowBlur=8;
  P.forEach(p=>{let x,y;
    if(MODE==='loop'){const w=2*Math.PI*t/6;x=p.x+Math.sin(w+p.ph)*p.ax;y=p.y+Math.cos(w+p.ph)*p.ax*.6;}
    else{x=p.x+Math.sin(t*.6+p.ph)*p.ax;y=((p.y-p.sp*t)%H+H)%H;}
    const tw=.6+.4*Math.sin((MODE==='loop'?2*Math.PI*t/3:t*2.1)+p.ph);
    dx.fillStyle=`rgba(236,206,60,${p.a*tw*amt})`;dx.beginPath();dx.arc(x,y,p.r,0,6.283);dx.fill();});}

// ---------- overlays ----------
const vig=el(`<div id="vig"></div>`);
const grain=el(`<div id="grain"></div>`);grain.style.backgroundImage=`url(${gc.toDataURL()})`;
function overlays(t){const R=rnd(Math.floor(t*30)+1);grain.style.backgroundPosition=`${Math.floor(R()*256)}px ${Math.floor(R()*256)}px`;
  vig.style.opacity=.85+.15*Math.sin(t*(MODE==='loop'?2*Math.PI/6:1.1));
  light.style.opacity=.75+.25*Math.sin(t*(MODE==='loop'?2*Math.PI/6:.8)+1);}
function frameDraw(t,a,b){fr.setAttribute('stroke-dashoffset',1000*(1-eio(win(t,a,b))));}
function glint(t,a,b){const p=win(t,a,b);gl.setAttribute('opacity',p>0&&p<1?Math.sin(p*Math.PI):0);gl.setAttribute('stroke-dashoffset',-1000*eio(p));}

// ======================================================================
let render;
if(MODE==='std'){
  // layout (1080x1920; text kept between y 250 and 1580)
  const [mL,mR]=logos(262,72,56,110);
  const kick=textLine(360,34,'Two JCCs. One Tournament.');
  const T=titleBlock(402,106,104);
  const vs=textLine(626,34,'MARJCC <span style="color:var(--gold)">vs.</span> MBJCC');
  const r1=rule(678,620), gm=textLine(690,34,'Golf &nbsp;•&nbsp; Mahjong'), r2=rule(736,620);
  const ph=photo(752,500);
  const save=el(`<div class="L c play nowrap" style="top:1222px;font-size:112px;line-height:1">SAVE THE DATE</div>`);
  const date=textLine(1350,58,'Friday &nbsp;|&nbsp; March 12, 2027','caps','var(--gold)','letter-spacing:.12em;text-indent:.12em');
  const team=textLine(1418,34,'Team MARJCC vs. Team MBJCC','caps','var(--gold)','letter-spacing:.1em;text-indent:.1em');
  const venue=textLine(1460,32,'Miami Beach Golf Club','caps','var(--white)','letter-spacing:.12em;text-indent:.12em');
  // end card
  const e2=textLine(1420,24,'More details and sponsorship information coming soon!','caps','var(--gold)','letter-spacing:.1em;text-indent:.1em');
  const e3=el(`<div class="L c" style="top:1458px;font-family:Poppins,Arial,sans-serif;font-weight:700;font-size:20px;line-height:1.28">For more information, please contact:<br><span style="font-weight:500">MARJCC: Roxana Markus &ndash;</span> RoxanaM@marjcc.org<br><span style="font-weight:500">MBJCC: Karen Sepsenwol &ndash;</span> karen@mbjcc.org</div>`);
  const gm2=el(`<img class="L" src="gmjf-logo-white.png" style="left:${(W-76)/2}px;top:1542px;height:36px">`);
  render=(t)=>{
    st.style.filter=`brightness(${eoc(win(t,0,.8))})`;
    frameDraw(t,.1,1.6); glint(t,11.2,13.4);
    [mL,mR].forEach((m,i)=>setO(m,eoc(win(t,.8+i*.15,1.6+i*.15)),(1-eoc(win(t,.8+i*.15,1.6+i*.15)))*-14));
    trackIn(kick,t,1.4,2.4);
    revealTitle(T,t,2.1,.055,.75); gleam(T,t,3.9,1.2);
    setO(vs,eoc(win(t,3.4,4.1)),(1-eoc(win(t,3.4,4.1)))*16);
    r1.style.transform=`scaleX(${eio(win(t,3.9,4.7))})`; r2.style.transform=`scaleX(${eio(win(t,4.0,4.8))})`; trackIn(gm,t,4.2,5.0);
    // photo push-in with parallax drift
    const pp=win(t,4.6,5.8), pz=win(t,4.6,14);
    ph.p.style.opacity=eoc(pp); ph.p.style.transform=`scale(${lerp(1.16,1.0,eio(win(t,4.6,9.5)))*lerp(1,1.035,win(t,9.5,14))}) translateY(${lerp(18,0,eio(pz))}px)`;
    ph.s.style.opacity=eoc(win(t,6.2,7.4))*(.55+.2*Math.sin(t*2.2));
    // SAVE THE DATE: tracking + rise
    const sp=eox(win(t,6.4,7.6)); save.style.opacity=sp; save.style.letterSpacing=`${lerp(.18,0,sp)}em`; save.style.transform=`translateY(${(1-sp)*22}px)`;
    const outInfo=1-eio(win(t,10.1,10.7));
    setO(date,eoc(win(t,7.4,8.1)),(1-eoc(win(t,7.4,8.1)))*14);
    setO(team,eoc(win(t,7.9,8.5))*outInfo,(1-eoc(win(t,7.9,8.5)))*12);
    setO(venue,eoc(win(t,8.3,8.9))*outInfo,(1-eoc(win(t,8.3,8.9)))*12);
    trackIn(e2,t,10.8,11.6,.5,.2);
    setO(e3,eoc(win(t,11.3,12.0)));
    setO(gm2,eoc(win(t,9.0,9.8)));
    drawDust(t,eoc(win(t,1.5,3)));overlays(t);
  };
}
if(MODE==='riv'){
  const [mL,mR]=logos(262,72,56,110);
  const a1=el(`<div class="L c play nowrap" style="top:600px;font-size:150px;line-height:1;color:var(--white)">Two JCCs.</div>`);
  const a2=el(`<div class="L c play nowrap" style="top:790px;font-size:112px;line-height:1;color:var(--gold)">One Tournament.</div>`);
  const a3=el(`<div class="L c play" style="top:950px;font-size:104px;line-height:1.05;color:var(--white)">One Friendly<br>Rivalry!</div>`);
  const a2g=el(`<div class="L c play nowrap gleam" style="top:790px;font-size:112px;line-height:1">One Tournament.</div>`);
  // split
  const div=el(`<div class="L" style="left:${W/2-1}px;top:520px;width:2px;height:820px;background:linear-gradient(transparent,#D8C012 12%,#D8C012 36%,transparent 39%,transparent 57%,#D8C012 60%,#D8C012 88%,transparent);transform-origin:center"></div>`);
  const tl=el(`<div class="L" style="left:60px;width:400px;top:640px;text-align:center"><img src="marjcc-white.png" style="height:150px"><div class="caps" style="font-size:40px;margin-top:40px">Team</div><div class="caps" style="font-size:78px;color:var(--gold);letter-spacing:.12em;text-indent:.12em">MARJCC</div></div>`);
  const tr=el(`<div class="L" style="right:60px;width:400px;top:640px;text-align:center"><img src="mbjcc-white.png" style="height:118px;margin:16px 0"><div class="caps" style="font-size:40px;margin-top:40px">Team</div><div class="caps" style="font-size:78px;color:var(--gold);letter-spacing:.12em;text-indent:.12em">MBJCC</div></div>`);
  const vsb=el(`<div class="L c" style="top:840px"><span class="play" style="display:inline-block;font-style:italic;font-size:120px;color:var(--gold);line-height:1.1;text-shadow:0 0 24px rgba(222,192,0,.35)">vs.</span></div>`);
  // golf / mahjong over photo
  const ph=photo(720,520);
  const g1=textLine(392,40,'Golf','caps','var(--gold)');
  const g2=el(`<div class="L c play nowrap" style="top:446px;font-size:76px;line-height:1">May the best team win!</div>`);
  const h1=textLine(1290,40,'Mahjong','caps','var(--gold)');
  const h2=el(`<div class="L c play nowrap" style="top:1344px;font-size:72px;line-height:1">Everyone plays together!</div>`);
  // end card
  const T=titleBlock(630,106,104);
  const e0=textLine(854,34,'MARJCC <span style="color:var(--gold)">vs.</span> MBJCC');
  const er=rule(906,620);
  const e1=textLine(940,58,'Friday &nbsp;|&nbsp; March 12, 2027','caps','var(--gold)','letter-spacing:.12em;text-indent:.12em');
  const e1b=textLine(1012,32,'Miami Beach Golf Club','caps','var(--white)','letter-spacing:.12em;text-indent:.12em');
  const e2=el(`<div class="L c play" style="top:1110px;font-size:48px;line-height:1.15">Two communities.<br>One unforgettable day!</div>`);
  const e3=textLine(1250,26,'More details and sponsorship information coming soon!','caps','var(--gold)','letter-spacing:.1em;text-indent:.1em');
  const e4=el(`<div class="L c" style="top:1300px;font-family:Poppins,Arial,sans-serif;font-weight:700;font-size:22px;line-height:1.35">For more information, please contact:<br><span style="font-weight:500">MARJCC: Roxana Markus &ndash;</span> RoxanaM@marjcc.org<br><span style="font-weight:500">MBJCC: Karen Sepsenwol &ndash;</span> karen@mbjcc.org</div>`);
  const gmj=el(`<img class="L" src="gmjf-logo-white.png" style="left:${(W-96)/2}px;top:1522px;height:46px">`);
  render=(t)=>{
    st.style.filter=`brightness(${eoc(win(t,0,.6))})`;
    frameDraw(t,.05,1.3); glint(t,9.6,11.8);
    [mL,mR].forEach((m,i)=>setO(m,eoc(win(t,.5+i*.12,1.2+i*.12))));
    // act 1: words
    const out1=1-eio(win(t,4.0,4.5));
    const w=(e,a,b)=>{const p=eox(win(t,a,b));e.style.opacity=p*out1;e.style.letterSpacing=`${lerp(.14,0,p)}em`;e.style.transform=`translateY(${(1-p)*30}px) scale(${lerp(1.04,1,p)})`;e.style.filter=`blur(${(1-p)*8}px)`;};
    w(a1,.8,1.7); w(a2,1.6,2.5); w(a3,2.4,3.3);
    const gp=win(t,2.8,3.8); a2g.style.opacity=(gp>0&&gp<1?1:0)*out1; a2g.style.backgroundPosition=`${lerp(110,-10,eio(gp))}% 0`;
    // act 2: split
    const sIn=eox(win(t,4.4,5.4)), sOut=1-eio(win(t,7.0,7.5));
    div.style.opacity=sOut; div.style.transform=`scaleY(${eio(win(t,4.3,5.0))})`;
    tl.style.opacity=sIn*sOut; tl.style.transform=`translateX(${(1-sIn)*-120}px)`;
    tr.style.opacity=sIn*sOut; tr.style.transform=`translateX(${(1-sIn)*120}px)`;
    const vp=eox(win(t,5.1,5.8)); vsb.style.opacity=vp*sOut; vsb.style.transform=`scale(${lerp(1.6,1,vp)})`;
    // act 3: photo + golf/mahjong
    const pIn=eoc(win(t,7.3,8.1)), pOut=1-eio(win(t,10.0,10.5));
    ph.p.style.opacity=pIn*pOut; ph.p.style.transform=`scale(${lerp(1.18,1.04,eio(win(t,7.3,10.5)))})`;
    ph.s.style.opacity=pIn*pOut*(.5+.2*Math.sin(t*2.4));
    const gg=eoc(win(t,7.7,8.4)), hh=eoc(win(t,8.5,9.2));
    setO(g1,gg*pOut,(1-gg)*-12); setO(g2,gg*pOut,(1-gg)*-16);
    setO(h1,hh*pOut,(1-hh)*12); setO(h2,hh*pOut,(1-hh)*16);
    // act 4: end card
    const eIn=t>10.3;
    [T.l1,T.l2].forEach(l=>l.style.opacity=eIn?1:0);
    revealTitle(T,t,10.35,.035,.6); gleam(T,t,11.3,1.0);
    setO(e0,eoc(win(t,10.8,11.3))); er.style.transform=`scaleX(${eio(win(t,10.9,11.5))})`;
    setO(e1,eoc(win(t,11.0,11.5)),(1-eoc(win(t,11.0,11.5)))*12); setO(e1b,eoc(win(t,11.15,11.6)));
    setO(e2,eoc(win(t,11.3,11.8))); setO(e3,eoc(win(t,11.45,11.9))); setO(e4,eoc(win(t,11.55,12)));
    setO(gmj,eoc(win(t,10.4,11.0)));
    drawDust(t,eoc(win(t,1,2.5)));overlays(t);
  };
}
if(MODE==='loop'){
  const [mL,mR]=logos(64,62,48,72);
  const kick=textLine(146,28,'Two JCCs. One Tournament.');
  const T=titleBlock(182,92,90);
  const vs=textLine(376,28,'MARJCC <span style="color:var(--gold)">vs.</span> MBJCC');
  const r1=rule(420,560),gm=textLine(430,28,'Golf &nbsp;•&nbsp; Mahjong'),r2=rule(470,560);
  r1.style.transform=r2.style.transform='scaleX(1)';
  const ph=photo(482,420);
  const save=el(`<div class="L c play nowrap" style="top:900px;font-size:104px;line-height:1">SAVE THE DATE</div>`);
  const date=textLine(1022,52,'Friday &nbsp;|&nbsp; March 12, 2027','caps','var(--gold)','letter-spacing:.12em;text-indent:.12em');
  const venue=textLine(1086,30,'Miami Beach Golf Club','caps','var(--white)','letter-spacing:.12em;text-indent:.12em');
  const more=textLine(1136,22,'More details and sponsorship information coming soon!','caps','var(--gold)','letter-spacing:.08em;text-indent:.08em');
  const gmj=el(`<img class="L" src="gmjf-logo-white.png" style="left:${(W-84)/2}px;top:1240px;height:40px">`);
  fr.setAttribute('stroke-dashoffset',0);
  T.chars.forEach(c=>{c.style.opacity=1});
  render=(t)=>{ // seamless 6s
    const w=2*Math.PI*t/6;
    gleam(T,t,.8,1.6);
    gl.setAttribute('opacity',.9);gl.setAttribute('stroke-dashoffset',-1000*(t/6));
    ph.p.style.transform=`scale(${1.04+.02*Math.sin(w)})`;
    ph.s.style.opacity=.55+.2*Math.sin(w*2);
    drawDust(t,1);overlays(t);
  };
}
document.fonts.ready.then(()=>{render(0);window.__ready=true;});
window.renderAt=(t)=>render(t);
</script>
