<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Josefin+Sans:wght@600;700&family=Playfair+Display:ital,wght@1,700;1,900&family=Noto+Serif+TC:wght@900&family=Mulish:wght@400;600;700&display=swap">
<style>
:root{--navy:#002838;--teal:#006868;--ocean:#009098;--red:#E02850;--gold:#F0C078;--gold2:#D9A653;--cream:#F8F0E0;--pink:#F89090;--sky:#40A8C0;--sun:#F8E098;--goldtxt:#8A5F18}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;background:#000}
#stage{position:relative;overflow:hidden;width:1080px;height:1920px;font-family:Mulish,sans-serif}
.abs{position:absolute}
.scene{position:absolute;inset:0}
.limel{font-family:Limelight,serif;font-weight:400}
.jos{font-family:'Josefin Sans',sans-serif;font-weight:700;text-transform:uppercase}
.frame{position:absolute;inset:36px;border:3px solid var(--gold);pointer-events:none}
.frame::after{content:"";position:absolute;inset:9px;border:1.5px solid var(--gold)}
.footer{position:absolute;left:0;right:0;background:#fff;display:flex;align-items:center;justify-content:center}
.footer img{height:96px}
.hosts{display:flex;align-items:center;justify-content:center;gap:44px}
.hosts .div{width:2px;align-self:stretch;background:var(--gold2)}
.mask{overflow:hidden;display:block}
.mask>span{display:block}
.waves{position:absolute;left:-200px;right:-200px;height:60px;background:
  radial-gradient(circle at 50% 100%, var(--teal) 0 27px, transparent 28px) 0 100% / 80px 40px repeat-x,
  radial-gradient(circle at 50% 100%, var(--ocean) 0 37px, transparent 38px) 40px 100% / 80px 60px repeat-x}
</style></head><body>
<div id="stage"></div>
<template id="logoT"><svg id="logo" class="logo" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 1600 1080">
<defs>
  <radialGradient id="ball" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".65" stop-color="#F3EEE6"/><stop offset="1" stop-color="#C9C3B8"/>
  </radialGradient>
  <pattern id="dimples" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="5.5" fill="#B9B2A6" opacity=".55"/>
    <circle cx="0" cy="0" r="5.5" fill="#B9B2A6" opacity=".55"/><circle cx="22" cy="0" r="5.5" fill="#B9B2A6" opacity=".55"/>
    <circle cx="0" cy="22" r="5.5" fill="#B9B2A6" opacity=".55"/><circle cx="22" cy="22" r="5.5" fill="#B9B2A6" opacity=".55"/>
  </pattern>
  <clipPath id="ballclip"><circle cx="800" cy="300" r="118"/></clipPath>
  <clipPath id="archclip"><path d="M548 420 V330 A252 252 0 0 1 1052 330 V420 Z"/></clipPath>
<clipPath id="wipe"><rect id="wiperect" x="0" y="400" width="0" height="400"/></clipPath>
</defs>

<g id="s-badge">
<g class="badge">
  <!-- outer gold silhouette -->
  <path class="gold-fill" fill="#D9A653" d="M530 330 A270 270 0 0 1 1070 330 V360 H1250 V400 H1420 V440 H1550 V860 H1500 V900 H1300 V940 H300 V900 H100 V860 H50 V440 H180 V400 H350 V360 H530 Z"/>
  <!-- cream body -->
  <path class="cream" fill="#F8F0E0" d="M542 342 A258 258 0 0 1 1058 342 V372 H1238 V412 H1408 V452 H1538 V848 H1488 V888 H1288 V928 H312 V888 H112 V848 H62 V452 H192 V412 H362 V372 H542 Z"/>
  <!-- inner hairline -->
  <path class="gold-line" fill="none" stroke="#D9A653" stroke-width="3" d="M560 360 A240 240 0 0 1 1040 360 V390 H1220 V430 H1390 V470 H1520 V830 H1470 V870 H1270 V910 H330 V870 H130 V830 H80 V470 H210 V430 H380 V390 H560 Z"/>
</g>

</g>
<g id="s-burst">
<g clip-path="url(#archclip)" class="burst">
  <g transform="translate(800 420)">
    <path class="ray-gold" fill="#F0C078" d="M0 0 L-300 -60 L-300 -120 Z"/>
    <path class="ray-teal" fill="#006868" d="M0 0 L-300 -170 L-260 -260 Z"/>
    <path class="ray-gold" fill="#F0C078" d="M0 0 L-200 -320 L-120 -330 Z"/>
    <path class="ray-teal" fill="#009098" d="M0 0 L-50 -340 L50 -340 Z"/>
    <path class="ray-gold" fill="#F0C078" d="M0 0 L120 -330 L200 -320 Z"/>
    <path class="ray-teal" fill="#006868" d="M0 0 L260 -260 L300 -170 Z"/>
    <path class="ray-gold" fill="#F0C078" d="M0 0 L300 -120 L300 -60 Z"/>
  </g>
</g>

</g>
<g id="s-tee">
<path class="navy" fill="#002838" d="M770 410 H830 Q811 426 807 446 L804 515 Q800 526 796 515 L793 446 Q789 426 770 410 Z"/>
</g>
<g id="s-ball">
<g class="ball">
  <circle cx="800" cy="300" r="118" fill="url(#ball)"/>
  <rect x="660" y="160" width="280" height="280" fill="url(#dimples)" clip-path="url(#ballclip)"/>
  <circle cx="800" cy="300" r="118" fill="none" stroke="#002838" stroke-width="5"/>
</g>

</g>
<g id="s-tile">
<g transform="rotate(-14 470 380)" class="tile">
  <rect x="372" y="250" width="200" height="250" rx="26" fill="#006868"/>
  <rect x="384" y="250" width="176" height="226" rx="20" fill="#FFF9EE" stroke="#002838" stroke-width="5"/>
  <text x="472" y="410" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="140" fill="#002838">中</text>
</g>

</g>
<g id="s-tiles2">
<g class="cards">
  <g transform="rotate(10 1100 370)">
    <rect x="1000" y="240" width="190" height="240" rx="24" fill="#006868"/>
    <rect x="1012" y="240" width="166" height="216" rx="18" fill="#FFF9EE" stroke="#002838" stroke-width="5"/>
    <text x="1095" y="392" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="124" fill="#006868">發</text>
  </g>
  <g transform="translate(34 14) rotate(22 1170 420)">
    <rect x="1080" y="290" width="190" height="240" rx="24" fill="#006868"/>
    <rect x="1092" y="290" width="166" height="216" rx="18" fill="#FFF9EE" stroke="#002838" stroke-width="5"/>
    <g>
      <circle cx="1130" cy="330" r="22" fill="#002838"/><circle cx="1130" cy="330" r="10" fill="#FFF9EE"/><circle cx="1130" cy="330" r="5" fill="#E02850"/>
      <circle cx="1175" cy="398" r="22" fill="#E02850"/><circle cx="1175" cy="398" r="10" fill="#FFF9EE"/><circle cx="1175" cy="398" r="5" fill="#002838"/>
      <circle cx="1220" cy="466" r="22" fill="#006868"/><circle cx="1220" cy="466" r="10" fill="#FFF9EE"/><circle cx="1220" cy="466" r="5" fill="#E02850"/>
    </g>
  </g>
</g>

</g>
<g id="s-word" clip-path="url(#wipe)">
<text id="golf" x="140" y="700" font-family="Limelight, serif" font-size="176" fill="#002838">GOLF</text>
<text id="amp" x="800" y="712" font-family="'Playfair Display', serif" font-style="italic" font-weight="900" font-size="230" fill="#006868">&amp;</text>
<text id="games" x="1460" y="700" font-family="Limelight, serif" font-size="176" fill="#002838">GAMES</text>

</g>
<g id="s-classic">
<g class="gold-stroke" stroke="#D9A653" stroke-width="4">
  <line x1="230" y1="772" x2="440" y2="772"/><line x1="250" y1="784" x2="440" y2="784"/>
  <line x1="1160" y1="772" x2="1370" y2="772"/><line x1="1160" y1="784" x2="1350" y2="784"/>
</g>
<text id="classic" x="800" y="808" text-anchor="middle" font-family="'Josefin Sans', sans-serif" font-weight="600" font-size="86" letter-spacing="34" fill="#E02850">CLASSIC</text>

</g>
<g id="s-plaque">
<path class="gold-fill" fill="#D9A653" d="M470 960 L520 900 H1080 L1130 960 L1080 1020 H520 Z"/>
<path class="cream" fill="#FFF9EE" d="M482 960 L527 908 H1073 L1118 960 L1073 1012 H527 Z"/>
<text x="800" y="982" text-anchor="middle" font-family="'Josefin Sans', sans-serif" font-weight="700" font-size="58" letter-spacing="4" fill="#002838"><tspan>MARJCC</tspan><tspan font-family="'Playfair Display', serif" font-style="italic" font-weight="700" fill="#E02850" font-size="54" dx="22">vs</tspan><tspan dx="22">MBJCC</tspan></text>

</g></svg></template>
<script>
const V=new URLSearchParams(location.search).get('v')||'std';
const W=1080,H=V==='loop'?1350:1920;
const st=document.getElementById('stage'); st.style.height=H+'px';
const clamp=x=>Math.max(0,Math.min(1,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const lerp=(a,b,x)=>a+(b-a)*x;
const $=s=>st.querySelector(s);
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function logoSVG(){return document.getElementById('logoT').innerHTML;}
function gT(svg,id,{tx=0,ty=0,s=1,r=0,ox=800,oy=540,o=1}={}){const g=svg.querySelector('#s-'+id);
  g.setAttribute('transform',`translate(${tx} ${ty}) translate(${ox} ${oy}) rotate(${r}) scale(${s}) translate(${-ox} ${-oy})`);g.style.opacity=o;}
function fitWord(svg){const g=svg.querySelector('#golf'),a=svg.querySelector('#amp'),m=svg.querySelector('#games');
  const wg=g.getBBox().width,wa=a.getBBox().width,wm=m.getBBox().width,gap=6;let x=800-(wg+wa+wm+2*gap)/2;
  g.setAttribute('x',x);a.setAttribute('x',x+wg+gap);m.setAttribute('x',x+wg+gap+wa+gap);}
const sunsetBG=`<div class="scene" style="background:linear-gradient(180deg,#40A8C0 0%,#7FB5C2 22%,#F89090 46%,#F9B98F 58%,#F8E098 66%,#009098 66.2%,#006868 80%,#002838 100%)"></div>
 <div class="abs" style="left:640px;top:1170px;width:300px;height:150px;border-radius:150px 150px 0 0;background:#F8E098;opacity:.9"></div>`;
const footer=(top,h)=>`<div class="footer" id="foot" style="top:${top}px;height:${h}px"><img src="gmjf-logo-black.png" alt="Greater Miami Jewish Federation"></div>`;
const hosts=(h1,h2)=>`<div class="hosts"><img src="marjcc-logo.png" style="height:${h1}px"><span class="div"></span><img src="mbjcc-logo.png" style="height:${h2}px"></div>`;
let render=()=>{};

/* ---------- STD: save the date reel ---------- */
if(V==='std'){
st.innerHTML=sunsetBG+`
<div class="frame" id="frame"></div>
<div class="abs" id="logoWrap" style="left:60px;top:380px;width:960px;transform-origin:50% 0">${logoSVG()}</div>
<div class="abs" id="panel" style="left:84px;top:870px;width:912px;height:530px;background:var(--cream);clip-path:polygon(0 24px,24px 24px,24px 0,calc(100% - 24px) 0,calc(100% - 24px) 24px,100% 24px,100% calc(100% - 24px),calc(100% - 24px) calc(100% - 24px),calc(100% - 24px) 100%,24px 100%,24px calc(100% - 24px),0 calc(100% - 24px))">
  <div class="abs" style="inset:14px;border:2px solid var(--gold2)"></div>
  <div class="scene" id="pA" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center">
    <div class="jos" id="aEye" style="font-weight:600;font-size:28px;letter-spacing:.22em;color:var(--goldtxt)">Golf &amp; Mahjong Tournament</div>
    <div class="limel" id="aTitle" style="font-size:92px;line-height:1;color:var(--navy);white-space:nowrap">SAVE THE DATE</div>
    <svg width="620" height="14" id="aRule"><line x1="0" y1="2" x2="620" y2="2" stroke="#D9A653" stroke-width="2"/><line x1="0" y1="11" x2="620" y2="11" stroke="#D9A653" stroke-width="2"/></svg>
    <div class="jos" id="aDate" style="font-size:66px;letter-spacing:.12em;color:var(--red)">March 12, 2027</div>
    <div class="jos" id="aVenue" style="font-size:38px;letter-spacing:.14em;color:var(--teal)">Miami Beach Golf Club</div>
  </div>
  <div class="scene" id="pB" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center">
    <div class="limel" id="bL1" style="font-size:66px;line-height:1.1;color:var(--navy)">Two communities.<br><span style="color:var(--teal)">One unforgettable day!</span></div>
    <div id="bHosts">${hosts(124,90)}</div>
    <div id="bMore" style="font-family:Mulish;font-weight:600;font-size:32px;color:#3C5560">More details coming soon!</div>
  </div>
</div>
${footer(1430,150)}`;
const svg=$('svg.logo'); fitWord(svg);
const rules=[...svg.querySelectorAll('#s-classic line')]; rules.forEach(l=>{const L=l.x2.baseVal.value-l.x1.baseVal.value;l.style.strokeDasharray=L;l.dataset.L=L;});
const aRule=[...$('#aRule').querySelectorAll('line')];aRule.forEach(l=>{l.style.strokeDasharray=620});
render=t=>{
  const f=eo(P(t,0,.9)); $('#frame').style.clipPath=`inset(${(1-f)*50}% 0 ${(1-f)*50}% 0)`;
  const fo=eo(P(t,.3,.9)); $('#foot').style.transform=`translateY(${(1-fo)*160}px)`; $('#foot').style.opacity=fo;
  let x=eo(P(t,.3,1.1)); gT(svg,'badge',{s:lerp(.8,1,x),o:x});
  x=eo(P(t,.9,1.7)); gT(svg,'burst',{s:x,ox:800,oy:420,o:x>0?1:0});
  x=eo(P(t,1.4,1.9)); gT(svg,'tee',{ty:(1-x)*60,o:x});
  x=eo(P(t,1.7,2.5)); gT(svg,'ball',{ty:-(1-x)*700,o:clamp(x*4)});
  x=eo(P(t,2.2,3.0)); gT(svg,'tile',{tx:-(1-x)*600,r:-(1-x)*40,ox:470,oy:380,o:clamp(x*3)});
  x=eo(P(t,2.4,3.2)); gT(svg,'tiles2',{tx:(1-x)*600,r:(1-x)*40,ox:1150,oy:400,o:clamp(x*3)});
  x=eio(P(t,3.0,4.0)); svg.querySelector('#wiperect').setAttribute('width',x*1600);
  x=eo(P(t,3.8,4.5)); svg.querySelector('#classic').style.opacity=x; svg.querySelector('#classic').setAttribute('letter-spacing',lerp(70,34,x));
  rules.forEach(l=>l.style.strokeDashoffset=l.dataset.L*(1-x));
  x=eo(P(t,4.3,4.9)); gT(svg,'plaque',{s:lerp(.6,1,x),ox:800,oy:960,o:x});
  x=eio(P(t,5.3,6.1)); $('#logoWrap').style.transform=`translateY(${-90*x}px) scale(${lerp(1,.82,x)})`;
  x=eo(P(t,5.6,6.4)); $('#panel').style.opacity=x; $('#panel').style.transform=`translateY(${(1-x)*220}px)`;
  const a=1-eo(P(t,9.2,9.6)); $('#pA').style.opacity=a;
  x=eo(P(t,6.2,6.7)); $('#aEye').style.opacity=x; $('#aEye').style.letterSpacing=lerp(.5,.22,x)+'em';
  x=eo(P(t,6.4,7.1)); $('#aTitle').style.opacity=x; $('#aTitle').style.letterSpacing=lerp(.25,0,x)+'em';
  x=eio(P(t,6.8,7.4)); aRule.forEach(l=>l.style.strokeDashoffset=620*(1-x));
  x=eo(P(t,7.0,7.6)); $('#aDate').style.opacity=x; $('#aDate').style.transform=`translateY(${(1-x)*30}px)`;
  x=eo(P(t,7.8,8.4)); $('#aVenue').style.opacity=x; $('#aVenue').style.transform=`translateY(${(1-x)*30}px)`;
  x=eo(P(t,9.6,10.2)); $('#bL1').style.opacity=x; $('#bL1').style.transform=`translateY(${(1-x)*30}px)`;
  x=eo(P(t,9.9,10.5)); $('#bHosts').style.opacity=x; $('#bHosts').style.transform=`scale(${lerp(.9,1,x)})`;
  x=eo(P(t,10.3,10.8)); $('#bMore').style.opacity=x;
};
window.__dur=12;
}

/* ---------- RIV: rivalry reel ---------- */
if(V==='riv'){
st.innerHTML=`
<div class="scene" id="s1" style="background:var(--navy)">
  <div class="abs" style="left:0;right:0;top:560px;text-align:center">
    <span class="mask"><span class="limel" id="l1" style="font-size:150px;line-height:1.12;color:var(--cream)">TWO JCCs.</span></span>
    <span class="mask"><span class="limel" id="l2" style="font-size:94px;line-height:1.3;color:#4FC3C9">ONE TOURNAMENT.</span></span>
    <span class="mask"><span class="limel" id="l3" style="font-size:118px;line-height:1.12;color:#FF5C7C">ONE FRIENDLY</span></span>
    <span class="mask"><span class="limel" id="l4" style="font-size:118px;line-height:1.12;color:#FF5C7C">RIVALRY!</span></span>
    <svg width="700" height="14" id="r1" style="margin-top:34px"><line x1="0" y1="2" x2="700" y2="2" stroke="#F0C078" stroke-width="2"/><line x1="0" y1="11" x2="700" y2="11" stroke="#F0C078" stroke-width="2"/></svg>
  </div>
</div>
<div class="scene" id="s2">
  <div class="abs" id="left" style="left:0;top:0;width:540px;height:1920px;background:#006478;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;color:#fff;text-align:center;padding-bottom:300px">
    <div style="background:#fff;width:330px;height:250px;display:flex;align-items:center;justify-content:center"><img src="marjcc-logo.png" style="width:250px"></div>
    <div class="jos" style="font-size:40px;letter-spacing:.3em">Team</div>
    <div class="limel" style="font-size:96px;line-height:1">MARJCC</div>
  </div>
  <div class="abs" id="right" style="left:540px;top:0;width:540px;height:1920px;background:#4078BC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;color:#fff;text-align:center;padding-bottom:300px">
    <div style="background:#fff;width:330px;height:250px;display:flex;align-items:center;justify-content:center"><img src="mbjcc-logo.png" style="width:290px"></div>
    <div class="jos" style="font-size:40px;letter-spacing:.3em">Team</div>
    <div class="limel" style="font-size:60px;line-height:1.1">MIAMI BEACH<br>JCC</div>
  </div>
  <div class="abs" id="vline" style="left:538px;top:250px;width:4px;height:1180px;background:var(--gold);transform-origin:50% 50%"></div>
  <div class="abs" id="vs" style="left:440px;top:1060px;width:200px;height:200px;border-radius:50%;background:var(--navy);border:5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-style:italic;font-weight:900;font-size:92px;color:var(--gold);padding-bottom:14px">vs.</div>
</div>
<div class="scene" id="s3" style="background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:90px;text-align:center;padding-bottom:260px">
  <div id="g1"><div class="jos" style="font-weight:600;font-size:36px;letter-spacing:.3em;color:var(--goldtxt)">Golf</div><div class="limel" style="font-size:88px;line-height:1.1;color:var(--navy);margin-top:16px">May the best<br>team win!</div></div>
  <svg width="520" height="14" id="r3"><line x1="0" y1="2" x2="520" y2="2" stroke="#D9A653" stroke-width="2"/><line x1="0" y1="11" x2="520" y2="11" stroke="#D9A653" stroke-width="2"/></svg>
  <div id="g2"><div class="jos" style="font-weight:600;font-size:36px;letter-spacing:.3em;color:var(--goldtxt)">Mahjong</div><div class="limel" style="font-size:88px;line-height:1.1;color:var(--teal);margin-top:16px">Everyone plays<br>together!</div></div>
</div>
<div class="scene" id="s4" style="background:var(--cream)">
  <div class="frame" style="border-color:var(--gold2)"></div>
  <img id="e1" src="golf-games-classic-logo.png" class="abs" style="left:60px;top:290px;width:960px">
  <div id="e2" class="abs jos" style="left:0;right:0;top:990px;text-align:center;font-size:52px;letter-spacing:.12em;color:var(--red)">March 12, 2027</div>
  <div id="e3" class="abs jos" style="left:0;right:0;top:1065px;text-align:center;font-size:36px;letter-spacing:.14em;color:var(--teal)">Miami Beach Golf Club</div>
  <div id="e4" class="abs" style="left:0;right:0;top:1170px">${hosts(130,94)}</div>
</div>
${footer(1430,150)}`;
const masks=['#l1','#l2','#l3','#l4'].map(s=>$(s)); const r1=[...$('#r1').querySelectorAll('line')],r3=[...$('#r3').querySelectorAll('line')];
render=t=>{
  [[.2],[.9],[1.6],[1.9]].forEach(([a],i)=>{const x=eo(P(t,a,a+.6));masks[i].style.transform=`translateY(${(1-x)*110}%)`;});
  let x=eio(P(t,2.4,3.0)); r1.forEach(l=>{l.style.strokeDasharray=700;l.style.strokeDashoffset=700*(1-x)});
  x=eio(P(t,3.3,3.8)); $('#s1').style.transform=`translateY(${-x*200}px)`; $('#s1').style.opacity=1-x;
  x=eo(P(t,3.4,3.95)); $('#left').style.transform=`translateX(${-(1-x)*540}px)`; $('#right').style.transform=`translateX(${(1-x)*540}px)`;
  $('#s2').style.display=t>=3.4&&t<6.9?'block':'none';
  x=eio(P(t,3.9,4.4)); $('#vline').style.transform=`scaleY(${x})`;
  x=eo(P(t,4.1,4.6)); $('#vs').style.opacity=x; $('#vs').style.transform=`scale(${lerp(.5,1,x)}) rotate(${(1-x)*-20}deg)`;
  x=eio(P(t,6.3,6.9)); $('#s3').style.clipPath=`inset(${(1-x)*100}% 0 0 0)`; $('#s3').style.display=t>=6.3?'flex':'none';

};

}
