<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Josefin+Sans:wght@600;700&family=Playfair+Display:ital,wght@1,700;1,900&family=Noto+Serif+TC:wght@900&display=swap">
<style>
html,body{margin:0;background:#F3E7CF;overflow:hidden}
svg{display:block}
.lime{font-family:Limelight,serif}
.caps{font-family:'Josefin Sans',sans-serif;font-weight:700;text-transform:uppercase}
</style></head>
<body>
<svg id="S" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>
<template id="logoTpl">
<defs>
  <radialGradient id="lgBall" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".65" stop-color="#F3EEE6"/><stop offset="1" stop-color="#C9C3B8"/>
  </radialGradient>
  <pattern id="lgDimples" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="5.5" fill="#B9B2A6" opacity=".55"/>
    <circle cx="0" cy="0" r="5.5" fill="#B9B2A6" opacity=".55"/><circle cx="22" cy="0" r="5.5" fill="#B9B2A6" opacity=".55"/>
    <circle cx="0" cy="22" r="5.5" fill="#B9B2A6" opacity=".55"/><circle cx="22" cy="22" r="5.5" fill="#B9B2A6" opacity=".55"/>
  </pattern>
  <clipPath id="lgBallclip"><circle cx="800" cy="300" r="118"/></clipPath>
  <clipPath id="lgArchclip"><path d="M548 420 V330 A252 252 0 0 1 1052 330 V420 Z"/></clipPath>
</defs>

<!-- BADGE -->
<g class="badge">
  <!-- outer gold silhouette -->
  <path class="gold-fill" fill="#D9A653" d="M530 330 A270 270 0 0 1 1070 330 V360 H1250 V400 H1420 V440 H1550 V860 H1500 V900 H1300 V940 H300 V900 H100 V860 H50 V440 H180 V400 H350 V360 H530 Z"/>
  <!-- cream body -->
  <path class="cream" fill="#F8F0E0" d="M542 342 A258 258 0 0 1 1058 342 V372 H1238 V412 H1408 V452 H1538 V848 H1488 V888 H1288 V928 H312 V888 H112 V848 H62 V452 H192 V412 H362 V372 H542 Z"/>
  <!-- inner hairline -->
  <path class="gold-line" fill="none" stroke="#D9A653" stroke-width="3" d="M560 360 A240 240 0 0 1 1040 360 V390 H1220 V430 H1390 V470 H1520 V830 H1470 V870 H1270 V910 H330 V870 H130 V830 H80 V470 H210 V430 H380 V390 H560 Z"/>
</g>

<!-- SUNBURST inside the arch -->
<g clip-path="url(#lgArchclip)" class="burst">
  <g transform="translate(800 420)">
    <path class="ray-gold" fill="#F0C078" d="M0 0 L-300 -60 L-300 -120 Z"/>
    <path class="ray-teal" fill="#006868" d="M0 0 L-300 -170 L-260 -260 Z"/>
    <path class="ray-gold" fill="#F0C078" d="M0 0 L-200 -320 L-120 -330 Z"/>
    <path class="ray-teal" fill="#009098" d="M0 0 L-50 -340 L50 -340 Z"/>
    <path class="ray-gold" fill="#F0C078" d="M0 0 L120 -330 L200 -320 Z"/>
    <path class="ray-teal" fill="#006868" d="M0 0 L260 -260 L300 -170 Z"/>
    <path class="ray-gold" fill="#F0C078" d="M0 0 L300 -120 L300 -60 Z"/>
  </g>
</g>

<!-- TEE -->
<path class="navy" fill="#002838" d="M770 410 H830 Q811 426 807 446 L804 515 Q800 526 796 515 L793 446 Q789 426 770 410 Z"/>
<!-- GOLF BALL -->
<g class="ball">
  <circle cx="800" cy="300" r="118" fill="url(#lgBall)"/>
  <rect x="660" y="160" width="280" height="280" fill="url(#lgDimples)" clip-path="url(#lgBallclip)"/>
  <circle cx="800" cy="300" r="118" fill="none" stroke="#002838" stroke-width="5"/>
</g>

<!-- MAHJONG TILE -->
<g transform="rotate(-14 470 380)" class="tile">
  <rect x="372" y="250" width="200" height="250" rx="26" fill="#006868"/>
  <rect x="384" y="250" width="176" height="226" rx="20" fill="#FFF9EE" stroke="#002838" stroke-width="5"/>
  <text x="472" y="410" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="140" fill="#002838">中</text>
</g>

<!-- MAHJONG TILES (right) -->
<g class="cards">
  <g transform="rotate(10 1100 370)">
    <rect x="1000" y="240" width="190" height="240" rx="24" fill="#006868"/>
    <rect x="1012" y="240" width="166" height="216" rx="18" fill="#FFF9EE" stroke="#002838" stroke-width="5"/>
    <text x="1095" y="392" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="124" fill="#006868">發</text>
  </g>
  <g transform="translate(34 14) rotate(22 1170 420)">
    <rect x="1080" y="290" width="190" height="240" rx="24" fill="#006868"/>
    <rect x="1092" y="290" width="166" height="216" rx="18" fill="#FFF9EE" stroke="#002838" stroke-width="5"/>
    <g>
      <circle cx="1130" cy="330" r="22" fill="#002838"/><circle cx="1130" cy="330" r="10" fill="#FFF9EE"/><circle cx="1130" cy="330" r="5" fill="#E02850"/>
      <circle cx="1175" cy="398" r="22" fill="#E02850"/><circle cx="1175" cy="398" r="10" fill="#FFF9EE"/><circle cx="1175" cy="398" r="5" fill="#002838"/>
      <circle cx="1220" cy="466" r="22" fill="#006868"/><circle cx="1220" cy="466" r="10" fill="#FFF9EE"/><circle cx="1220" cy="466" r="5" fill="#E02850"/>
    </g>
  </g>
</g>

<!-- WORDMARK -->
<text id="golf" x="133.79296875" y="700" font-family="Limelight, serif" font-size="176" fill="#002838">GOLF</text>
<text id="amp" x="617.31640625" y="712" font-family="'Playfair Display', serif" font-style="italic" font-weight="900" font-size="230" fill="#006868">&amp;</text>
<text id="games" x="840.31640625" y="700" font-family="Limelight, serif" font-size="176" fill="#002838">GAMES</text>

<!-- CLASSIC with gold rules -->
<g class="gold-stroke" stroke="#D9A653" stroke-width="4">
  <line x1="230" y1="772" x2="440" y2="772"/><line x1="250" y1="784" x2="440" y2="784"/>
  <line x1="1160" y1="772" x2="1370" y2="772"/><line x1="1160" y1="784" x2="1350" y2="784"/>
</g>
<text id="classic" x="800" y="808" text-anchor="middle" font-family="'Josefin Sans', sans-serif" font-weight="600" font-size="86" letter-spacing="34" fill="#E02850">CLASSIC</text>

<!-- PLAQUE -->
<path class="gold-fill" fill="#D9A653" d="M470 960 L520 900 H1080 L1130 960 L1080 1020 H520 Z"/>
<path class="cream" fill="#FFF9EE" d="M482 960 L527 908 H1073 L1118 960 L1073 1012 H527 Z"/>
<text x="800" y="982" text-anchor="middle" font-family="'Josefin Sans', sans-serif" font-weight="700" font-size="58" letter-spacing="4" fill="#002838"><tspan>MARJCC</tspan><tspan font-family="'Playfair Display', serif" font-style="italic" font-weight="700" fill="#E02850" font-size="54" dx="22">vs</tspan><tspan dx="22">MBJCC</tspan></text>
</template>
<script>
// ---------- palette ----------
const C={navy:'#002838',teal:'#006868',ocean:'#009098',red:'#E02850',gold:'#F0B870',pink:'#F89090',cream:'#F3E7CF',tan:'#EAD7AE',line:'#C9963E',goldText:'#8A5F18',dateGold:'#F0C078',marjcc:'#006478',mbjcc:'#4078BC',ink:'#3C5560'};
const V=new URLSearchParams(location.search).get('v')||'std';
const W=1080,H=V==='loop'?1350:1920;
const S=document.getElementById('S');S.setAttribute('width',W);S.setAttribute('height',H);S.setAttribute('viewBox',`0 0 ${W} ${H}`);
const NS='http://www.w3.org/2000/svg';
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);                       // easeOutCubic
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;     // easeInOutCubic
const ex=x=>x===1?1:1-Math.pow(2,-10*x);              // easeOutExpo
const eb=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}; // easeOutBack
function el(tag,attrs={},parent=S,html){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(html!==undefined)e.innerHTML=html;parent.appendChild(e);return e;}
function g(attrs={},parent=S){return el('g',attrs,parent);}
function set(e,attrs){for(const k in attrs)e.setAttribute(k,attrs[k]);}
function rays(parent,n,r,a0deg,spread,cols){let s='';for(let i=0;i<n;i++){const a0=(a0deg+i*spread/n)*Math.PI/180,a1=(a0deg+(i+1)*spread/n)*Math.PI/180;s+=`<path d="M0 0 L${Math.cos(a0)*r} ${Math.sin(a0)*r} A${r} ${r} 0 0 1 ${Math.cos(a1)*r} ${Math.sin(a1)*r} Z" fill="${cols[i%cols.length]}"/>`;}parent.innerHTML=s;return [...parent.children];}
function draw(path,p){path.setAttribute('pathLength',1);path.setAttribute('stroke-dasharray',1);path.setAttribute('stroke-dashoffset',1-p);}
function txt(parent,str,x,y,o={}){const ls=o.ls||0;const e=el('text',{x:x+ls/2,y,'text-anchor':'middle',class:o.cls||'lime','font-size':o.size||40,fill:o.fill||C.navy,'letter-spacing':ls},parent);e.textContent=str;return e;}
function img(parent,href,x,y,w,h){return el('image',{href,x,y,width:w,height:h},parent);}
const defs=el('defs');
let uid=0;const id=p=>p+(++uid);

// ---------- building blocks ----------
// Top color band (navy sunburst panel + blocks + scallops + gold double rule)
function Band(){
  const root=g();const h=170;
  const cp=el('clipPath',{id:'bandClip'},defs);el('rect',{x:0,y:0,width:414,height:h},cp);
  const blocks=[[0,414,C.navy],[414,180,C.teal],[594,81,C.red],[675,261,C.gold],[936,144,C.pink]].map(([x,w,f])=>el('rect',{x,y:0,width:w,height:h,fill:f},root));
  const rg=g({'clip-path':'url(#bandClip)'},root);const rr=g({transform:`translate(207 ${h})`},rg);
  const ry=rays(rr,28,520,-180,360,[C.cream,C.navy]);
  const sc=g({fill:C.ocean},root);const scs=[];for(let x=675;x<1080;x+=36){scs.push(el('path',{d:`M${x} ${h} a18 18 0 0 1 36 0 z`},sc));}
  const r1=el('path',{d:`M0 ${h+8} H${W}`,stroke:C.line,'stroke-width':3,fill:'none'},root);
  const r2=el('path',{d:`M0 ${h+16} H${W}`,stroke:C.line,'stroke-width':3,fill:'none'},root);
  return {root,update(t,t0=0,spin=0){
    blocks.forEach((b,i)=>{const p=eo(P(t,t0+i*.08,t0+.55+i*.08));b.setAttribute('transform',`translate(0 ${-(1-p)*h})`);});
    const pr=ex(P(t,t0+.3,t0+1.2));rr.setAttribute('transform',`translate(207 ${h}) rotate(${spin}) scale(${pr})`);
    scs.forEach((s,i)=>{const p=eb(P(t,t0+.7+i*.03,t0+1.05+i*.03));s.setAttribute('opacity',p>0?1:0);s.style.transformBox='fill-box';s.style.transformOrigin='50% 100%';s.style.transform=`scale(${Math.max(0,p)})`;});
    draw(r1,eio(P(t,t0+.6,t0+1.3)));draw(r2,eio(P(t,t0+.7,t0+1.4)));
  }};
}
// Vertical gold double frame lines
function Frame(y0,y1){const root=g();const ls=[36,48,W-48,W-36].map(x=>el('path',{d:`M${x} ${y0} V${y1}`,stroke:C.line,'stroke-width':3,fill:'none'},root));
  return {root,update(t,t0=0){ls.forEach((l,i)=>draw(l,eio(P(t,t0+(i%2)*.1,t0+1.2+(i%2)*.1))));}};}
// Hosts (teal, no box)
function Hosts(y,hM=76,dark=false){const root=g();const sfx=dark?'white':'teal';
  const wM=hM*747/465,hB=hM*0.79,wB=hB*1997/684,gap=26,tot=wM+gap*2+2+wB,x0=W/2-tot/2;
  img(root,`marjcc-${sfx}.png`,x0,y,wM,hM);
  el('rect',{x:x0+wM+gap,y:y+4,width:2,height:hM-8,fill:dark?'#FFFFFF':C.teal,opacity:.5},root);
  img(root,`mbjcc-${sfx}.png`,x0+wM+gap*2+2,y+(hM-hB)/2,wB,hB);
  return {root,update(t,t0=0){const p=eo(P(t,t0,t0+.7));set(root,{opacity:p,transform:`translate(0 ${(1-p)*-16})`});}};}
// GMJF footer
function Gmjf(y,h=64){const root=g();const w=h*710/338;img(root,'gmjf-logo-black.png',W/2-w/2,y,w,h);
  return {root,update(t,t0=0){set(root,{opacity:eo(P(t,t0,t0+.7))});}};}
// Scallop rows (rolling)
function Scallops(y,R=34,rows=3,clipW=W){const root=g();const cp=el('clipPath',{id:id('scl')},defs);el('rect',{x:0,y:y-R-4,width:clipW,height:R+rows*R*.8+8},cp);
  const inner=g({'clip-path':`url(#${cp.id})`},root);const rowsG=[];
  for(let r=0;r<rows;r++){const rg=g({},inner);const yy=y+r*R*.8;const col=r%2?C.teal:C.ocean;
    for(let x=-4*R;x<W+4*R;x+=2*R){el('path',{d:`M${x-R} ${yy} a${R} ${R} 0 0 1 ${2*R} 0 z`,fill:col,stroke:C.line,'stroke-width':2},rg);}rowsG.push(rg);}
  return {root,update(t,t0=0,roll=0){rowsG.forEach((rg,r)=>{const p=eo(P(t,t0+r*.12,t0+.8+r*.12));const off=((r%2?R:0)+(r%2?-1:1)*roll*2*R)%(2*R);set(rg,{transform:`translate(${off} ${(1-p)*120})`,opacity:p});});}};}
// Fan divider with diamonds
function FanDivider(y){const root=g();const ls=[[160,y-5,470],[160,y+5,470],[610,y-5,920],[610,y+5,920]].map(([x1,yy,x2])=>el('path',{d:`M${x1} ${yy} H${x2}`,stroke:C.line,'stroke-width':3,fill:'none'},root));
  const fan=g({transform:`translate(540 ${y+22})`},root);rays(fan,7,46,-180,180,[C.line,C.cream]);
  const tri=el('path',{d:`M526 ${y+22} L540 ${y+8} L554 ${y+22} Z`,fill:C.red},root);
  const dm=[476,604].map(x=>el('path',{d:`M${x-11} ${y} L${x} ${y-11} L${x+11} ${y} L${x} ${y+11} Z`,fill:C.teal},root));
  return {root,update(t,t0=0){ls.forEach((l,i)=>{const p=eio(P(t,t0,t0+.7));draw(l,p);});const pf=eb(P(t,t0+.2,t0+.7));set(fan,{transform:`translate(540 ${y+22}) scale(${Math.max(0,pf)})`});set(tri,{opacity:P(t,t0+.4,t0+.6)});dm.forEach(d=>set(d,{opacity:P(t,t0+.5,t0+.8)}));}};}
// Teal pointed matchup plaque
function MatchPlaque(cx,cy,w,h,label){const root=g();const inner=g({},root);
  const hw=w/2,hh=h/2,pt=h*.55;
  el('path',{d:`M${-hw} 0 L${-hw+pt} ${-hh} H${hw-pt} L${hw} 0 L${hw-pt} ${hh} H${-hw+pt} Z`,fill:C.teal,stroke:C.line,'stroke-width':5},inner);
  el('path',{d:`M${-hw+20} 0 L${-hw+pt+8} ${-hh+12} H${hw-pt-8} L${hw-20} 0 L${hw-pt-8} ${hh-12} H${-hw+pt+8} Z`,fill:'none',stroke:C.dateGold,'stroke-width':2},inner);
  const tg=g({},inner);
  if(label==='vs'){txt(tg,'vs.',0,hh*.42,{size:h*.62,fill:C.dateGold});}
  else{const t1=el('text',{x:0,y:h*.13,'text-anchor':'middle',class:'caps','font-size':h*.33,fill:C.cream,'letter-spacing':h*.06},tg);t1.innerHTML=`<tspan>TEAM MARJCC </tspan><tspan class="lime" style="text-transform:none" fill="${C.dateGold}" letter-spacing="0">vs.</tspan><tspan> TEAM MBJCC</tspan>`;}
  return {root,update(t,t0=0){const p=ex(P(t,t0,t0+.8));set(root,{transform:`translate(${cx} ${cy})`,opacity:P(t,t0,t0+.2)});set(inner,{transform:`scale(${.25+.75*p} 1)`});set(tg,{opacity:P(t,t0+.45,t0+.8)});}};}
// Stepped navy date plaque
function DatePlaque(cx,cy,w,h,str,size){const root=g();const inner=g({},root);const hw=w/2,hh=h/2,s1=w*.085,s2=h*.1;
  const d=(o)=>`M${-hw+o} ${-hh+2*s2+o} H${-hw+s1+o} V${-hh+s2+o} H${-hw+2*s1+o} V${-hh+o} H${hw-2*s1-o} V${-hh+s2+o} H${hw-s1-o} V${-hh+2*s2+o} H${hw-o} V${hh-2*s2-o} H${hw-s1-o} V${hh-s2-o} H${hw-2*s1-o} V${hh-o} H${-hw+2*s1+o} V${hh-s2-o} H${-hw+s1+o} V${hh-2*s2-o} H${-hw+o} Z`;
  el('path',{d:d(0),fill:C.navy,stroke:C.line,'stroke-width':5},inner);
  const l2=el('path',{d:d(14),fill:'none',stroke:C.line,'stroke-width':2},inner);
  const tx=txt(inner,str,0,size*.36,{size,fill:C.dateGold});
  const sweep=el('rect',{x:-hw,y:-hh,width:60,height:h,fill:'#FFF6DC',opacity:0,transform:'skewX(-20)'},inner);
  const cp=el('clipPath',{id:id('dpc')},defs);el('path',{d:d(0)},cp);sweep.setAttribute('clip-path',`url(#${cp.id})`);
  return {root,update(t,t0=0){const p1=eo(P(t,t0,t0+.35)),p2=eo(P(t,t0+.2,t0+.6));set(root,{transform:`translate(${cx} ${cy})`,opacity:P(t,t0,t0+.15)});
    // stepped open: width first then height, in steps
    const sx=Math.ceil(p1*4)/4*.7+p1*.3, sy=Math.ceil(p2*3)/3*.6+p2*.4;set(inner,{transform:`scale(${sx} ${Math.max(.04,sy)})`});
    draw(l2,eio(P(t,t0+.45,t0+1.1)));set(tx,{opacity:P(t,t0+.5,t0+.8)});
    const ps=P(t,t0+.9,t0+1.6);set(sweep,{opacity:ps>0&&ps<1?.35:0,x:-hw-120+ps*(w+240)});},sweepAt(t,a){const ps=P(t,a,a+.8);set(sweep,{opacity:ps>0&&ps<1?.35:0,x:-hw-120+ps*(w+240)});}};}
// The event logo, assembled from its parts
function Logo(cx,top,w){const s=w/1600;const root=g({transform:`translate(${cx-w/2} ${top}) scale(${s})`});
  const holder=g({},root);holder.innerHTML=document.getElementById('logoTpl').innerHTML;
  const q=sel=>holder.querySelector(sel);
  const badge=q('.badge'),burst=q('.burst'),tee=q('path.navy'),ball=q('g.ball'),tile=q('g.tile'),cards=q('g.cards');
  const golf=q('#golf'),amp=q('#amp'),games=q('#games'),classic=q('#classic'),gs=q('.gold-stroke');
  const kids=[...holder.children];const plaqueEls=kids.slice(kids.indexOf(classic)+1);
  const rayEls=[...burst.querySelectorAll('path')];const tileT=tile.getAttribute('transform');
  const badgeLine=badge.querySelector('.gold-line');
  // wordmark reveal clip + gold sweep
  const wcp=el('clipPath',{id:id('wm')},defs);const wrect=el('rect',{x:0,y:520,width:0,height:240},wcp);
  [golf,amp,games].forEach(e=>e.setAttribute('clip-path',`url(#${wcp.id})`));
  const tcp=el('clipPath',{id:id('wt')},defs);['golf','amp','games'].forEach(k=>el('use',{href:'#'+k},tcp));
  const sweep=el('rect',{x:-200,y:520,width:120,height:240,fill:'#FFF3D6',opacity:.55,transform:'skewX(-18)','clip-path':`url(#${tcp.id})`},holder);
  const o=(e,v)=>e.setAttribute('opacity',v);
  return {root,update(t,t0=0,full=false){
    if(full){t=t0+20;}
    const pb=eo(P(t,t0,t0+.7));set(badge,{transform:`translate(800 600) scale(${.55+.45*pb}) translate(-800 -600)`});o(badge,pb);
    draw(badgeLine,eio(P(t,t0+.2,t0+1.2)));
    rayEls.forEach((r,i)=>{const p=ex(P(t,t0+.4+i*.06,t0+.9+i*.06));r.setAttribute('transform',`scale(${p})`);});
    const pt=eo(P(t,t0+.6,t0+1.0));o(tee,pt);set(tee,{transform:`translate(0 ${(1-pt)*40})`});
    const pd=P(t,t0+.8,t0+1.35);const bounce=pd<1?(1-Math.pow(1-pd,2))*1:1;const by=pd<.75?-(1-eio(pd/.75))*900:-Math.sin((pd-.75)/.25*Math.PI)*28;
    o(ball,pd>0?1:0);set(ball,{transform:`translate(0 ${by})`});
    const fl=(p)=>Math.max(.001,Math.abs(Math.cos((1-p)*Math.PI/2*2))*(p<.5?-1:1));
    const p1=eo(P(t,t0+1.2,t0+1.75));o(tile,p1>0?1:0);tile.setAttribute('transform',`${tileT} translate(470 375) scale(${Math.max(.001,Math.sin(p1*Math.PI/2))} 1) translate(-470 -375) translate(0 ${(1-p1)*-60})`);
    const p2=eo(P(t,t0+1.4,t0+1.95));o(cards,p2>0?1:0);cards.setAttribute('transform',`translate(1150 400) scale(${Math.max(.001,Math.sin(p2*Math.PI/2))} 1) translate(-1150 -400) translate(0 ${(1-p2)*-60})`);
    const pw=eio(P(t,t0+1.8,t0+2.6));set(wrect,{width:1600*pw});
    const ps=P(t,t0+2.5,t0+3.3);set(sweep,{x:-300+ps*2100,opacity:ps>0&&ps<1?.55:0});
