<script>
const V=new URLSearchParams(location.search).get('v')||'std';
const W=1080,H=V==='loop'?1350:1920;
const stage=document.getElementById('stage');stage.style.height=H+'px';
const bg=document.getElementById('bg'),fx=document.getElementById('fx');bg.height=H;fx.height=H;
const B=bg.getContext('2d'),F=fx.getContext('2d');
const world=document.getElementById('world'),ov=document.getElementById('ov');world.style.height=H+'px';
const clamp=x=>Math.max(0,Math.min(1,x)),P=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,x)=>a+(b-a)*x;
const eo=x=>1-Math.pow(1-x,3),eexp=x=>x>=1?1:1-Math.pow(2,-10*x),eic=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const rnd=i=>{const v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v)};
const TAU=Math.PI*2;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixc=(a,b,m)=>{const A=hex(a),Bc=hex(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,Bc[i],m))).join(',')})`};
const $=s=>stage.querySelector(s);

/* ---------- camera ---------- */
let cam={x:540,y:H/2,z:1,r:0};
function applyCam(){world.style.transform=`translate(${W/2}px,${H/2}px) rotate(${cam.r}deg) scale(${cam.z}) translate(${-cam.x}px,${-cam.y}px)`;}
function toScreen(x,y){const dx=(x-cam.x)*cam.z,dy=(y-cam.y)*cam.z,c=Math.cos(cam.r*Math.PI/180),s=Math.sin(cam.r*Math.PI/180);return [W/2+dx*c-dy*s,H/2+dx*s+dy*c];}

/* ---------- sprites ---------- */
function sprite(r,stops){const c=document.createElement('canvas');c.width=c.height=r*2;const g=c.getContext('2d');const gr=g.createRadialGradient(r,r,0,r,r,r);stops.forEach(([o,col])=>gr.addColorStop(o,col));g.fillStyle=gr;g.fillRect(0,0,r*2,r*2);return c;}
const SP_GOLD=sprite(64,[[0,'rgba(255,236,190,1)'],[.25,'rgba(255,214,140,.55)'],[1,'rgba(255,200,120,0)']]);
const SP_BOKEH=sprite(64,[[0,'rgba(255,226,170,.0)'],[.55,'rgba(255,220,160,.35)'],[.8,'rgba(255,215,150,.55)'],[.86,'rgba(255,215,150,.12)'],[1,'rgba(255,215,150,0)']]);
const SP_WHITE=sprite(128,[[0,'rgba(255,255,255,1)'],[.2,'rgba(255,246,220,.7)'],[1,'rgba(255,230,190,0)']]);
const SP_TEAL=sprite(128,[[0,'rgba(80,230,230,.9)'],[.35,'rgba(0,150,160,.45)'],[1,'rgba(0,100,120,0)']]);
const SP_BLUE=sprite(128,[[0,'rgba(150,200,255,.9)'],[.35,'rgba(64,120,188,.5)'],[1,'rgba(40,80,160,0)']]);
function blot(ctx,sp,x,y,r,a){ctx.globalAlpha=a;ctx.drawImage(sp,x-r,y-r,r*2,r*2);ctx.globalAlpha=1;}

/* ---------- scene: sky / sun / water ---------- */
const SKY_DAY=['#071F33','#0E4560','#2A8BA8','#7FB4C4','#F08E9C','#F9A88E','#FCD49A'];
const SKY_NIGHT=['#01070D','#021520','#04283A','#073648','#0C4352','#12505E','#1B5E66'];
const WAT_DAY=['#F6BE96','#D88C8A','#5E8E9A','#0D5B66','#032B3A'];
const WAT_NIGHT=['#1B5E66','#0E3E4C','#082C3A','#041C28','#010C14'];
function drawScene(t,o){ // o: {hy, m (0 night..1 day), sunX, sunY, sunA, par}
  const {hy,m}=o; B.globalCompositeOperation='source-over';
  const sky=B.createLinearGradient(0,hy-1500,0,hy);
  const pos=[0,.28,.5,.66,.8,.9,1];
  pos.forEach((p,i)=>sky.addColorStop(p,mixc(SKY_NIGHT[i],SKY_DAY[i],m)));
  B.fillStyle=sky;B.fillRect(0,0,W,H);
  // sun + bloom
  if(o.sunA>0){B.globalCompositeOperation='lighter';
    blot(B,SP_GOLD,o.sunX,o.sunY,900,.38*o.sunA*m);
    blot(B,SP_GOLD,o.sunX,o.sunY,420,.55*o.sunA*m);
    B.globalCompositeOperation='source-over';
    const sg=B.createRadialGradient(o.sunX,o.sunY-20,10,o.sunX,o.sunY,150);sg.addColorStop(0,'#FFF8DC');sg.addColorStop(.7,'#FFE2A0');sg.addColorStop(1,'rgba(255,214,150,0)');
    B.globalAlpha=o.sunA;B.fillStyle=sg;B.beginPath();B.arc(o.sunX,o.sunY,150,0,TAU);B.fill();B.globalAlpha=1;}
  // drifting cloud wisps (soft, fluid)
  B.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++){const y=hy-180-i*95-rnd(i)*60, x=((rnd(i+9)*W*1.6+t*(8+i*3)*(o.drift??1))%(W*1.6))-W*.3;
    B.save();B.translate(x,y);B.scale(5+rnd(i+3)*4,1);blot(B,SP_GOLD,0,0,70,.10*m+.03);B.restore();}
  B.globalCompositeOperation='source-over';
  // water with soft horizon (no hard line)
  const wg=B.createLinearGradient(0,hy-90,0,H+200);
  wg.addColorStop(0,'rgba(0,0,0,0)');
  const wc=WAT_DAY.map((c,i)=>mixc(WAT_NIGHT[i],c,m));
  const rgba=(c,a)=>c.replace('rgb','rgba').replace(')',`,${a})`);
  wg.addColorStop(.05,rgba(wc[0],.35));wg.addColorStop(.11,rgba(wc[0],.85));wg.addColorStop(.15,wc[0]);wg.addColorStop(.2,wc[1]);wg.addColorStop(.42,wc[2]);wg.addColorStop(.7,wc[3]);wg.addColorStop(1,wc[4]);
  B.fillStyle=wg;B.fillRect(0,hy-90,W,H-hy+300);
  // horizon haze glow
  B.globalCompositeOperation='lighter';
  B.save();B.translate(o.sunX,hy);B.scale(9,.9);blot(B,SP_GOLD,0,0,160,.55*m+.08);B.restore();B.save();B.translate(W/2,hy);B.scale(14,.5);blot(B,SP_GOLD,0,0,120,.25*m);B.restore();
  // shimmering reflections
  const rows=70,depthH=H-hy;B.globalCompositeOperation='lighter';
  for(let r=0;r<rows;r++){const d=r/rows,y=hy+4+Math.pow(d,1.8)*depthH;if(y>H+10)break;
    const spread=40+d*420;
    for(let j=0;j<6;j++){const sd=r*13+j*7;const x=o.sunX+(rnd(sd)-.5)*spread*2+Math.sin(t*2.0944+r*.9+j*1.7)*(8+d*30);
      const w=(14+d*150)*(.5+rnd(sd+1)),hh=1.5+d*5;
      const a=(.5+.5*Math.sin(t*5.236+r*1.7+j*2.3))*Math.exp(-Math.pow((x-o.sunX)/spread,2))*.85*o.sunA*m;
      if(a<.02)continue;B.save();B.translate(x,y);B.scale(w/40,hh/6);blot(B,SP_GOLD,0,0,20,a*.9);B.restore();}
    // cool glints everywhere
    if(r%2==0){const x=rnd(r*31+Math.floor((t*3)%18))*W, a=.10*(.5+.5*Math.sin(t*7.330+r));B.save();B.translate(x,y);B.scale((10+d*90)/30,(1+d*3)/5);blot(B,SP_TEAL,0,0,15,a);B.restore();}
  }
  B.globalCompositeOperation='source-over';
}

/* ---------- foreground: palms, particles, leaks, flare ---------- */
function frond(ctx,x,y,ang,len,t,seed){
  const sway=Math.sin(t*1.0472+seed*1.7)*0.06+Math.sin(t*3.1416+seed)*0.025;
  const a=ang+sway, droop=.9+rnd(seed)*.5;
  const ex=x+Math.cos(a)*len, ey=y+Math.sin(a)*len+len*.35*droop;
  const cx=x+Math.cos(a)*len*.55, cy=y+Math.sin(a)*len*.55-len*.12;
  ctx.lineCap='round';ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(cx,cy,ex,ey);ctx.stroke();
  const N=22;
  for(let i=1;i<N;i++){const u=i/N;
    const px=(1-u)*(1-u)*x+2*(1-u)*u*cx+u*u*ex, py=(1-u)*(1-u)*y+2*(1-u)*u*cy+u*u*ey;
    const tx=2*(1-u)*(cx-x)+2*u*(ex-cx), ty=2*(1-u)*(cy-y)+2*u*(ey-cy), tl=Math.hypot(tx,ty);
    const nx=-ty/tl, ny=tx/tl, L=(1-u*.85)*len*.32*(1+.15*Math.sin(i*1.3+seed));
    for(const s of [-1,1]){const lx=px+nx*L*s+tx/tl*L*.5, ly=py+ny*L*s+ty/tl*L*.5+L*.35;
      ctx.beginPath();ctx.moveTo(px-tx/tl*6,py-ty/tl*6);ctx.lineTo(lx,ly);ctx.lineTo(px+tx/tl*10,py+ty/tl*10);ctx.fill();}
  }
}
function palm(ctx,bx,by,cx,cy,sc,t,seed,col){
  ctx.fillStyle=col;ctx.strokeStyle=col;
  ctx.lineWidth=30*sc;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(lerp(bx,cx,.5)+60*sc,lerp(by,cy,.5),cx,cy);ctx.stroke();
  const angs=[-2.9,-2.4,-1.9,-1.35,-.8,-.25,.3,2.6,3.4];
  angs.forEach((a,i)=>frond(ctx,cx,cy,a,(260+rnd(seed+i)*140)*sc,t,seed+i));
  blot(ctx,SP_GOLD,cx,cy,1,0);
}
function palms(t,o){ // o: {dy, z, col, set}
  F.save();F.translate(W/2,H/2);F.scale(o.z,o.z);F.translate(-W/2,-H/2+o.dy);
  const col=o.col||'rgba(2,18,26,.96)';
  if(o.set!=='bottom'){
    palm(F,-140,700,-10,150,1.05,t,1,col);
    palm(F,1240,620,1110,120,1.0,t,20,col);
  }
  palm(F,1260,H+260,1110,H-250,0.95,t,40,col);
  palm(F,-200,H+300,-40,H-170,0.8,t,60,col);
  F.restore();
}
const NP=110;
function particles(t,o){ // o:{dy, a, speed}
  F.globalCompositeOperation='lighter';
  for(let i=0;i<NP;i++){const z=.3+rnd(i)*1.2;
    const per=H+300;let y=(o.loopU!=null?(rnd(i+500)*per - o.loopU*per*(1+Math.floor(z*1.5))):(rnd(i+500)*per - t*(18+z*40)*(o.speed??1) - (o.dy||0)*z*.6))%per; if(y<0)y+=per; y-=150;
    const x=rnd(i+900)*W+Math.sin(t*.5236+i)*30*z;
    const tw=.55+.45*Math.sin(t*1.0472*(2+Math.floor(rnd(i+3)*3))+i);
    const r=(3+z*10)*(i%9==0?3.5:1);
    blot(F,i%9==0?SP_BOKEH:SP_GOLD,x,y,r,(.18+.5*rnd(i+77))*tw*(o.a??1));
  }
  F.globalCompositeOperation='source-over';
}
function leaks(t,a){F.globalCompositeOperation='screen';
  blot(F,SP_GOLD,-80+Math.sin(t*.5236)*120,H*.32+Math.cos(t*.5236)*180,700,.20*a);
  blot(F,SP_GOLD,W+60+Math.cos(t*.5236)*100,H*.68+Math.sin(t*1.0472)*200,800,.16*a);
  F.globalCompositeOperation='source-over';}
function flare(sx,sy,a){if(a<=0)return;F.globalCompositeOperation='lighter';
  const cx=W/2,cy=H*.45,dx=cx-sx,dy=cy-sy;
  [[.35,60,.10],[.6,24,.18],[.9,110,.07],[1.25,40,.12],[1.6,170,.05]].forEach(([k,r,al],i)=>blot(F,i%2?SP_TEAL:SP_GOLD,sx+dx*k,sy+dy*k,r,al*a));
  const g=F.createLinearGradient(sx-W,0,sx+W,0);g.addColorStop(0,'rgba(255,220,170,0)');g.addColorStop(.5,`rgba(255,240,210,${.55*a})`);g.addColorStop(1,'rgba(255,220,170,0)');
  F.fillStyle=g;F.fillRect(sx-W,sy-2,W*2,4);
  F.globalCompositeOperation='source-over';}
function ring(x,y,r,a,w,col){if(a<=0)return;F.globalCompositeOperation='lighter';F.strokeStyle=col||`rgba(255,220,150,${a})`;F.lineWidth=w;F.beginPath();F.arc(x,y,r,0,TAU);F.stroke();F.globalCompositeOperation='source-over';}
function flash(x,y,r,a){if(a<=0)return;F.globalCompositeOperation='lighter';blot(F,SP_WHITE,x,y,r,a);F.globalCompositeOperation='source-over';}
function vignette(a){const g=F.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.75);g.addColorStop(0,'rgba(0,10,16,0)');g.addColorStop(1,`rgba(0,10,16,${a})`);F.fillStyle=g;F.fillRect(0,0,W,H);}

/* ---------- logo (SVG + 3D tiles) ---------- */
function makeLogo(parent,left,top,width){

function ktIn(d,x,{stag=.035,dur=.5,mode='rise'}={}){const n=d.chs.length;d.chs.forEach((c,i)=>{const v=clamp((x-i*stag)/dur);const e=eexp(v);

function offsetPts(pts,d){return pts.map((p,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return [p[0]-dy/l*d,p[1]+dx/l*d];});}
