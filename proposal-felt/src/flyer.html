<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Bebas+Neue&family=Poppins:wght@600;700&display=swap">
<style>
:root{--gold:#DEC000;--frame:#D8C012;--silver:#B4BAB4;--felt:#454C42;--felt-deep:#3A413A;--white:#F4F3EE}
html,body{margin:0}
.flyer{position:relative;width:1200px;height:1965px;overflow:hidden;background:var(--felt-deep);color:var(--white);font-family:'Bebas Neue',Impact,sans-serif}
.felt{position:absolute;inset:0}
.frame{position:absolute;left:55px;top:58px;width:1090px;height:1590px;border:3px solid var(--frame);box-sizing:border-box}
.abs{position:absolute;left:0;right:0;text-align:center}
.caps{letter-spacing:.34em;text-indent:.34em}
.title{font-family:'Playfair Display',Georgia,serif;font-weight:400;color:var(--gold);line-height:.9}
.amp{font-family:'Playfair Display',Georgia,serif;color:var(--silver)}
.rule{position:absolute;left:230px;right:230px;height:2px;background:rgba(244,243,238,.55)}
.photo{position:absolute;left:66px;top:640px;width:1068px;height:620px;background:url(../assets/photo-temp.jpg) center/cover;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 82%,transparent 100%),linear-gradient(to right,transparent 0,#000 6%,#000 94%,transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.nowrap{white-space:nowrap}
</style></head><body>
<div class="flyer" id="flyer">
  <svg class="felt" width="1200" height="1965">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .30  0 0 0 0 .34  0 0 0 0 .29  0 0 0 .55 0"/></filter>
    <radialGradient id="v" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#535A4D"/><stop offset=".55" stop-color="#4B5247"/><stop offset="1" stop-color="#383F38"/></radialGradient>
    <rect width="1200" height="1965" fill="url(#v)"/><rect width="1200" height="1965" filter="url(#n)" opacity=".45"/>
  </svg>
  <div class="frame"></div>

  <img src="../assets/marjcc-white.png" style="position:absolute;left:105px;top:105px;height:84px">
  <img src="../assets/mbjcc-white.png" style="position:absolute;right:105px;top:113px;height:68px">

  <div class="abs caps" style="top:218px;font-size:40px">Two JCCs. One Tournament.</div>
  <div class="abs title nowrap" style="top:268px;font-size:124px">GOLF<span class="amp" style="font-size:150px;margin:0 -6px;position:relative;top:10px">&amp;</span>GAMES</div>
  <div class="abs title" style="top:372px;font-size:124px">CLASSIC</div>
  <div class="abs caps" style="top:500px;font-size:40px">MARJCC <span style="color:var(--gold)">vs.</span> MBJCC</div>
  <div class="rule" style="top:560px"></div>
  <div class="abs caps" style="top:574px;font-size:40px">Golf &nbsp;•&nbsp; Mahjong</div>
  <div class="rule" style="top:628px"></div>

  <div class="photo"></div>

  <div class="abs title nowrap" style="top:1250px;font-size:136px;color:var(--white)">SAVE THE DATE</div>
  <div class="abs caps" style="top:1400px;font-size:62px;color:var(--gold);letter-spacing:.12em;text-indent:.12em">Friday &nbsp;|&nbsp; March 12, 2027</div>
  <div class="abs caps" style="top:1478px;font-size:40px;color:var(--gold);letter-spacing:.1em;text-indent:.1em">Team MARJCC vs. Team MBJCC</div>
  <div class="abs caps" style="top:1536px;font-size:36px;letter-spacing:.12em;text-indent:.12em">Miami Beach Golf Club</div>

  <div class="abs caps" style="top:1690px;font-size:34px;letter-spacing:.14em;text-indent:.14em">Two communities. One unforgettable day!</div>
  <div class="abs caps" style="top:1738px;font-size:28px;color:var(--gold);letter-spacing:.2em;text-indent:.2em">More details coming soon!</div>
  <div class="abs" style="top:1800px;font-family:Poppins,Arial,sans-serif;font-weight:700;font-size:28px;line-height:1.35">For more information, please contact<br>RoxanaM@marjcc.org</div>
  <img src="../assets/gmjf-logo-white.png" style="position:absolute;left:550px;top:1895px;height:48px">
</div>
<script>document.fonts.ready.then(()=>window.__ready=true)</script>
</body></html>
